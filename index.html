'use strict';

/* =========================================================
   智能仓库管理系统 V2.2
   ========================================================= */

const APP_VERSION = 'V2.2-20260910';

/* =========================================================
   Supabase
   ========================================================= */

const SUPABASE_URL =
  'https://veqzicbdvodonkbsbyrt.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_njvb3co4PlkaWTAphXSW4g_IdSynRe-';

const APP = {
  sb:null,
  user:null,
  warehouse:null,
  warehouses:[],
  inventory:[],
  logs:[],
  role:'member',

  page:'home',

  authMode:'login',

  stockType:'in',

  realtime:null,

  scanner:null,
  scannerRunning:false,
  scannerMode:null,

  recovery:false,

  booting:false,

  logSearch:''
};

const $ = id =>
  document.getElementById(id);

const esc = s =>
  String(s ?? '').replace(
    /[&<>'"]/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[c])
  );

function showError(msg){
  alert(msg || '操作失败');
}

function showRealError(prefix,e){
  console.error(prefix,e);

  let m =
    e?.message ||
    e?.error_description ||
    e?.details ||
    '未知错误';

  if(e?.hint){
    m += '\n提示：'+e.hint;
  }

  if(e?.code){
    m += '\n代码：'+e.code;
  }

  if(e?.status){
    m += '\nHTTP状态：'+e.status;
  }

  showError(prefix+'\n\n'+m);
}

/* =========================================================
   Supabase
   ========================================================= */

function getConfig(){
  return {
    url:SUPABASE_URL.trim().replace(/\/$/,''),
    key:SUPABASE_KEY.trim()
  };
}

function getRedirectUrl(){
  const u =
    new URL(window.location.href);

  u.search='';
  u.hash='';

  return u.toString();
}

function isRecoveryLink(){

  const raw =
    (location.hash||'')
      .replace(/^#/,'');
  
  if(!raw)
    return false;

  try{

    const p =
      new URLSearchParams(raw);

    return p.get('type')==='recovery';

  }catch(e){

    return false;

  }
}

function cleanRecoveryUrl(){

  try{

    const u =
      new URL(window.location.href);

    u.hash='';
    u.search='';

    history.replaceState(
      {},
      document.title,
      u.toString()
    );

  }catch(e){}
}

function rpcValue(data){

  if(data==null)
    return null;

  if(typeof data==='string')
    return data;

  if(Array.isArray(data))
    return rpcValue(data[0]);

  if(typeof data==='object'){

    return (
      data.id ||
      data.warehouse_id ||
      data.warehouseId ||
      data.result ||
      data.value ||
      null
    );

  }

  return null;
}

function initSupabase(){

  const c =
    getConfig();

  if(!c.url || !c.key){

    renderAuth();

    return false;
  }

  try{

    if(
      !window.supabase ||
      !window.supabase.createClient
    ){

      throw new Error(
        'Supabase JS组件没有加载成功，请检查网络连接。'
      );

    }

    APP.sb =
      window.supabase.createClient(
        c.url,
        c.key,
        {
          auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
          }
        }
      );

    return true;

  }catch(e){

    showRealError(
      '云端初始化失败',
      e
    );

    return false;
  }
}

/* =========================================================
   云端诊断
   ========================================================= */

async function testSupabaseConnection(){

  const result =
    $('connectionResult');

  const button =
    $('connectionButton');

  if(result){

    result.textContent =
      '正在测试云端连接……';

    result.className =
      'mt-3 text-center text-sm text-blue-600 font-bold';
  }

  if(button){

    button.disabled=true;

    button.textContent=
      '正在测试……';
  }

  try{

    const url =
      SUPABASE_URL.trim().replace(/\/$/,'');

    const key =
      SUPABASE_KEY.trim();

    const response =
      await fetch(
        url+'/auth/v1/settings',
        {
          method:'GET',
          headers:{
            'apikey':key
          },
          cache:'no-store'
        }
      );

    const text =
      await response.text();

    console.log(
      'Supabase诊断:',
      {
        url,
        status:response.status,
        response:text
      }
    );

    if(response.ok){

      if(result){

        result.innerHTML =
          '✅ 云端连接正常！<br>'+
          'HTTP '+response.status+
          ' · API Key 有效';

        result.className =
          'mt-3 text-center text-sm text-green-600 font-bold';

      }

    }else{

      let detail=text;

      try{

        const j =
          JSON.parse(text);

        detail =
          j.message ||
          j.error_description ||
          j.error ||
          text;

      }catch(e){}

      if(result){

        result.innerHTML =
          '❌ 云端返回错误<br>'+
          'HTTP '+response.status+
          '<br><span class="font-normal break-words">'+
          esc(detail.slice(0,500))+
          '</span>';

        result.className =
          'mt-3 text-center text-sm text-red-600 font-bold';

      }
    }

  }catch(e){

    console.error(
      'Supabase连接测试失败',
      e
    );

    if(result){

      result.innerHTML =
        '❌ 网络连接失败<br>'+
        '<span class="font-normal">'+
        esc(e.message || String(e))+
        '</span>';

      result.className =
        'mt-3 text-center text-sm text-red-600 font-bold';
    }

  }

  if(button){

    button.disabled=false;

    button.textContent=
      '🔧 再次测试云端连接';
  }
}

          ${

            '没有账号？注册'

        </button>

        <button

        </button>

        <div

          尚未测试云端连接

        </div>

        <div class="text-center text-xs text-gray-400 pt-2">

          当前版本：${APP_VERSION}

        </div>

      </div>

    </div>

  </div>

  `;
}

function toggleAuth(){

  APP.authMode =
    APP.authMode==='login'
    ?
    'register'
    :
    'login';

  renderAuth();
}

function authMsg(text,ok=false){

  const e =
    $('authMsg');

  if(!e)
    return;

  e.textContent=text;

  e.className =
    'mb-4 rounded-xl p-3 text-sm '+
    (
      ok
      ?
      'bg-green-50 text-green-700'
      :
      'bg-red-50 text-red-700'
    );
}

async function authSubmit(){

  if(!APP.sb){

    showError(
      '云端尚未连接'
    );

    return;
  }

  const email =
    $('authEmail')?.value.trim();

  const pwd =
    $('authPwd')?.value;

  if(!email)
    return authMsg(
      '请输入邮箱'
    );

  if(!pwd)
    return authMsg(
      '请输入密码'
    );

  if(pwd.length<6)
    return authMsg(
      '密码至少6位'
    );

  try{

    if(APP.authMode==='register'){

      const r =
        await APP.sb.auth.signUp({
          email,
          password:pwd,
          options:{
            emailRedirectTo:
              getRedirectUrl()
          }
        });

      if(r.error)
        throw r.error;

      if(r.data?.session){

        authMsg(
          '注册成功，正在进入系统……',
          true
        );

        APP.user=
          r.data.user;

        await bootUser();

      }else{

        authMsg(
          '注册成功！如果系统要求邮箱确认，请打开邮箱确认。确认后返回这里，用刚才设置的密码登录。',
          true
        );
      }

      return;
    }

    const r =
      await APP.sb.auth.signInWithPassword({
        email,
        password:pwd
      });

    if(r.error){

      if(
        r.error.code===
        'invalid_credentials'
      ){

        throw new Error(
          '邮箱或密码不正确。\n\n如果你确定密码正确，请点击“忘记密码？”重新设置密码。'
        );

      }

      throw r.error;
    }

    APP.user=
      r.data.user;

    await bootUser();

  }catch(e){

    showRealError(
      APP.authMode==='register'
      ?
      '注册失败'
      :
      '登录失败',
      e
    );
  }
}

      <div class="text-center mb-5">

function recoveryMsg(text,ok=false){

  const e =
    $('recoveryMsg');

  if(!e)
    return;

  e.textContent=text;

  e.className =
    'mb-4 rounded-xl p-3 text-sm '+
    (
      ok
      ?
      'bg-green-50 text-green-700'
      :
      'bg-red-50 text-red-700'
    );
}

async function updateRecoveryPassword(){

  const p1 =
    $('newPwd')?.value || '';

  const p2 =
    $('newPwd2')?.value || '';

  if(p1.length<6)
    return recoveryMsg(
      '新密码至少6位'
    );

  if(p1!==p2)
    return recoveryMsg(
      '两次输入的密码不一致'
    );

  try{

    const r =
      await APP.sb.auth.updateUser({
        password:p1
      });

    if(r.error)
      throw r.error;

    APP.recovery=false;

    APP.user =
      r.data?.user ||
      APP.user;

    cleanRecoveryUrl();

    recoveryMsg(
      '密码修改成功！正在进入仓库……',
      true
    );

    setTimeout(
      async()=>{
        try{
          await bootUser();
        }catch(e){
          showRealError(
            '进入仓库失败',
            e
          );
        }
      },
      800
    );

  }catch(e){

    showRealError(
      '修改密码失败',
      e
    );
  }
}

/* =========================================================
   系统启动
   ========================================================= */

async function boot(){

  if(APP.booting)
    return;

  APP.booting=true;

  if(!initSupabase()){

    APP.booting=false;

    return;
  }

  if(isRecoveryLink())
    APP.recovery=true;

  APP.sb.auth.onAuthStateChange(
    (event,session)=>{

      console.log(
        'Supabase Auth:',
        event
      );

      if(event==='PASSWORD_RECOVERY'){

        APP.recovery=true;

        APP.user =
          session?.user ||
          APP.user;

        setTimeout(
          ()=>{
            if(APP.user)
              renderRecovery();
          },
          0
        );

        return;
      }

      if(session?.user){

        APP.user=
          session.user;

        if(APP.recovery){

          setTimeout(
            ()=>renderRecovery(),
            0
          );

        }else{

          setTimeout(
            ()=>{
              bootUser().catch(
                e=>
                  showRealError(
                    '读取账号数据失败',
                    e
                  )
              );
            },
            0
          );

        }

      }else if(event==='SIGNED_OUT'){

        APP.user=null;
        APP.warehouse=null;

        cleanupRealtime();

        APP.recovery=false;

        renderAuth();
      }
    }
  );

  try{

    const {
      data:{session},
      error
    } =
      await APP.sb.auth.getSession();

    if(error)
      throw error;

    if(
      APP.recovery ||
      isRecoveryLink()
    ){

      APP.recovery=true;

      if(session?.user){

        APP.user=
          session.user;

        renderRecovery();

      }else{

        renderAuth();

        authMsg(
          '密码重置链接已失效，请重新发送一封重置邮件。'
        );
      }

      APP.booting=false;

      return;
    }

    if(session?.user){

      APP.user=
        session.user;

      await bootUser();

    }else{

      renderAuth();

    }

  }catch(e){

    showRealError(
      '系统启动失败',
      e
    );

    renderAuth();

  }

  APP.booting=false;
}

/* =========================================================
   用户
   ========================================================= */

async function bootUser(){

  if(!APP.user || !APP.sb)
    return;

  await loadWarehouses();

  if(
    !APP.warehouse &&
    APP.warehouses.length
  ){

    APP.warehouse=
      APP.warehouses[0];

    APP.role=
      APP.warehouse.role ||
      'member';

    await Promise.all([
      loadInventory(),
      loadLogs()
    ]);

    setupRealtime();
  }

  renderApp();
}

/* =========================================================
   仓库
   ========================================================= */

async function loadWarehouses(){

  const {
    data:m,
    error:me
  } =
    await APP.sb
      .from('warehouse_members')
      .select('warehouse_id,role')
      .eq(
        'user_id',
        APP.user.id
      );

  if(me)
    throw me;

  const ids =
    (m||[])
      .map(x=>x.warehouse_id)
      .filter(Boolean);

  if(!ids.length){

    APP.warehouses=[];
    APP.warehouse=null;

    cleanupRealtime();

    return;
  }

  const {
    data:w,
    error:we
  } =
    await APP.sb
      .from('warehouses')
      .select('*')
      .in('id',ids);

  if(we)
    throw we;

  APP.warehouses =
    (w||[]).map(x=>({

      ...x,

      role:
        (m||[])
          .find(
            mm=>
              mm.warehouse_id===x.id
          )?.role ||
        'member'

    }));

  if(APP.warehouse){

    const nw =
      APP.warehouses.find(
        x=>
          x.id===
          APP.warehouse.id
      );

    APP.warehouse=
      nw||null;

    if(!nw)
      cleanupRealtime();
  }
}

async function selectWarehouse(id){

  const w =
    APP.warehouses.find(
      x=>x.id===id
    );

  if(!w)
    return;

  cleanupRealtime();

  APP.warehouse=w;

  APP.role=
    w.role||'member';

  APP.page='home';

  try{

    await Promise.all([
      loadInventory(),
      loadLogs()
    ]);

    setupRealtime();

    renderApp();

  }catch(e){

    showRealError(
      '读取仓库数据失败',
      e
    );
  }
}

async function createWarehouse(){

  const name =
    $('whName')?.value.trim();

  if(!name)
    return showError(
      '请输入仓库名称'
    );

  try{

    const r =
      await APP.sb.rpc(
        'create_warehouse',
        {
          p_name:name
        }
      );

    if(r.error)
      throw r.error;

    const id =
      rpcValue(r.data);

    await loadWarehouses();

    let w =
      id &&
      APP.warehouses.find(
        x=>x.id===id
      );

    if(!w){

      w =
        APP.warehouses.find(
          x=>
            x.name===name
        );
    }

    closeModal();

    if(w){

      await selectWarehouse(
        w.id
      );

    }else{

      renderApp();

      alert(
        '仓库创建成功，请重新选择仓库。'
      );
    }

  }catch(e){

    showRealError(
      '创建仓库失败',
      e
    );
  }
}

async function joinWarehouse(){

  const code =
    $('joinCode')?.value.trim();

  if(!/^\d{6}$/.test(code))
    return showError(
      '请输入6位数字邀请码'
    );

  try{

    const r =
      await APP.sb.rpc(
        'join_warehouse',
        {
          p_join_code:code
        }
      );

    if(r.error)
      throw r.error;

    const id =
      rpcValue(r.data);

    await loadWarehouses();

    const w =
      id &&
      APP.warehouses.find(
        x=>x.id===id
      );

    closeModal();

    if(w){

      await selectWarehouse(
        w.id
      );

    }else{

      renderApp();

      alert(
        '加入成功，请重新选择仓库。'
      );
    }

  }catch(e){

    showRealError(
      '加入仓库失败',
      e
    );
  }
}

/* =========================================================
   删除仓库
   ========================================================= */

async function deleteWarehouse(id){

  const w =
    APP.warehouses.find(
      x=>x.id===id
    );

  if(!w)
    return;

  if(
    w.role!=='owner'
  ){

    showError(
      '只有仓库所有者可以删除仓库。'
    );

    return;
  }

  const first =
    confirm(
      '⚠️ 确定要删除这个仓库吗？\n\n'+
      '仓库：'+w.name+
      '\n\n删除仓库属于危险操作，请确认。'
    );

  if(!first)
    return;

  const second =
    prompt(
      '为了防止误删，请输入仓库名称：\n\n'+
      w.name
    );

  if(second===null)
    return;

  if(
    second.trim()!==w.name.trim()
  ){

    showError(
      '仓库名称输入不正确，删除已取消。'
    );

    return;
  }

  try{

    const r =
      await APP.sb
        .from('warehouses')
        .delete()
        .eq('id',id);

    if(r.error)
      throw r.error;

    cleanupRealtime();

    if(
      APP.warehouse?.id===id
    ){

      APP.warehouse=null;
      APP.role='member';
      APP.inventory=[];
      APP.logs=[];
    }

    await loadWarehouses();

    if(APP.warehouses.length){

      APP.warehouse=
        APP.warehouses[0];

      APP.role=
        APP.warehouse.role ||
        'member';

      await Promise.all([
        loadInventory(),
        loadLogs()
      ]);

      setupRealtime();

    }else{

      APP.warehouse=null;
      APP.inventory=[];
      APP.logs=[];
    }

    APP.page='home';

    closeModal();

    renderApp();

    alert(
      '仓库已成功删除。'
    );

  }catch(e){

    console.error(
      '删除仓库失败',
      e
    );

    let msg =
      e?.message ||
      e?.details ||
      e?.hint ||
      '未知错误';

    showError(
      '删除仓库失败。\n\n'+
      msg+
      '\n\n如果提示存在关联数据，下一步我们再处理数据库关联删除。'
    );
  }
}

   库存
   ========================================================= */

async function loadInventory(){

  if(!APP.warehouse)
    return;

  const {
    data,
    error
  } =
    await APP.sb
      .from('inventory')
      .select('*')
      .eq(
        'warehouse_id',
        APP.warehouse.id
      )
      .order(
        'created_at',
        {
          ascending:false
        }
      );

  if(error)
    throw error;

  APP.inventory=
    data||[];
}

async function loadLogs(){

  if(!APP.warehouse)
    return;

  const {
    data,
    error
  } =
    await APP.sb
      .from('stock_logs')
      .select('*')
      .eq(
        'warehouse_id',
        APP.warehouse.id
      )
      .order(
        'created_at',
        {
          ascending:false
        }
      )
      .limit(200);

  if(error)
    throw error;

  APP.logs=
    data||[];
}

/* =========================================================
   实时同步
   ========================================================= */

function setupRealtime(){

  cleanupRealtime();

  if(!APP.warehouse)
    return;

  const wid=
    APP.warehouse.id;

  APP.realtime =
    APP.sb
      .channel(
        'warehouse-'+
        wid+
        '-'+
        Date.now()
      )

      .on(
        'postgres_changes',
        {
          event:'*',
          schema:'public',
          table:'inventory',
          filter:
            'warehouse_id=eq.'+
            wid
        },
        ()=>{
          loadInventory()
            .then(
              ()=>renderApp()
            )
            .catch(
              e=>
                console.error(
                  '库存同步失败',
                  e
                )
            );
        }
      )

      .on(
        'postgres_changes',
        {
          event:'*',
          schema:'public',
          table:'stock_logs',
          filter:
            'warehouse_id=eq.'+
            wid
        },
        ()=>{
          loadLogs()
            .then(
              ()=>{
                if(APP.page==='logs')
                  renderApp();
              }
            )
            .catch(
              e=>
                console.error(
                  '日志同步失败',
                  e
                )
            );
        }
      )

      .subscribe();
}

function cleanupRealtime(){

  if(
    APP.realtime &&
    APP.sb
  ){

    try{

      APP.sb.removeChannel(
        APP.realtime
      );

    }catch(e){}

    APP.realtime=null;
  }
}

function intVal(v){

  const n =
    Number(v);

  return Number.isInteger(n)&&n>=0
    ?
    n
    :
    null;
}

async function saveItem(id){

  const name =
    $('itemName')?.value.trim();

  const sku =
    $('itemSku')?.value.trim();

  const alertQty =
    intVal(
      $('itemAlert')?.value
    );

  const bin =
    $('itemBin')?.value.trim();

  if(!name||!sku)
    return showError(
      '商品名称和SKU不能为空'
    );

  if(alertQty===null)
    return showError(
      '低库存数量必须是非负整数'
    );

  if(!id){

    const qty =
      intVal(
        $('itemQty')?.value
      );

    if(qty===null)
      return showError(
        '初始库存必须是非负整数'
      );

    if(
      APP.inventory.some(
        x=>
          String(x.sku)
            .trim()
            .toLowerCase()
          ===
          sku.toLowerCase()
      )
    ){

      return showError(
        '当前仓库已经存在这个SKU'
      );
    }

    try{

      const r =
        await APP.sb.rpc(
          'create_inventory',
          {
            p_warehouse_id:
              APP.warehouse.id,
            p_name:name,
            p_sku:sku,
            p_qty:qty,
            p_alert:alertQty,
            p_bin:bin
          }
        );

      if(r.error)
        throw r.error;

      await loadInventory();

      closeModal();

      renderApp();

    }catch(e){

      showRealError(
        '新增商品失败',
        e
      );
    }

  }else{

    const dup =
      APP.inventory.find(
        x=>
          x.id!==id &&
          String(x.sku)
            .trim()
            .toLowerCase()
          ===
          sku.toLowerCase()
      );

    if(dup)
      return showError(
        '当前仓库已经存在这个SKU'
      );

    try{

      const r =
        await APP.sb.rpc(
          'update_inventory_info',
          {
            p_inventory_id:id,
            p_name:name,
            p_sku:sku,
            p_alert:alertQty,
            p_bin:bin
          }
        );

      if(r.error)
        throw r.error;

      await loadInventory();

      closeModal();

      renderApp();

    }catch(e){

      showRealError(
        '保存商品失败',
        e
      );
    }
  }
}

    $('stockSku')?.value.trim();

  const qty =
    intVal(
      $('stockQty')?.value
    );

  const note =
    $('stockNote')?.value.trim() ||
    '';

  if(!sku)
    return showError(
      '请输入或扫描SKU'
    );

  if(!qty||qty<1)
    return showError(
      '数量必须是大于0的整数'
    );

  const item =
    APP.inventory.find(
      x=>
        String(x.sku)
          .trim()

        ===

    );

  if(!item){

          p_type:APP.stockType,
          p_qty:qty,

function parseDelimited(
  text,
  delimiter=','
){

  const rows=[];

  let row=[];
  let cell='';
  let quote=false;

  for(
    let i=0;
    i<text.length;
    i++
  ){

    const c =
      text[i];

    const n =
      text[i+1];

    if(c==='"'){

      if(
        quote &&
        n==='"'
      ){

        cell+='"';

        i++;

      }else{

        quote=!quote;

      }

    }else if(
      c===delimiter &&
      !quote
    ){

      row.push(cell);

      cell='';

    }else if(
      (c==='\n'||c==='\r') &&
      !quote
    ){

      if(
        c==='\r' &&
        n==='\n'
      ){

        i++;
      }

      row.push(cell);

      cell='';

      if(
        row.some(
          v=>
            String(v).trim()!==''
        )
      ){

        rows.push(row);
      }

      row=[];

    }else{

      cell+=c;
    }
  }

  if(
    cell!=='' ||
    row.length
  ){

    row.push(cell);

    if(
      row.some(
        v=>
          String(v).trim()!==''
      )
    ){

      rows.push(row);
    }
  }

  return rows;
}

async function readRows(file){

  const name =
    (file.name||'')
      .toLowerCase();

  if(
    name.endsWith('.xlsx') ||
    name.endsWith('.xls')
  ){

    if(!window.XLSX){

      throw new Error(
        'Excel解析组件加载失败，请检查网络连接。'
      );
    }

    const buf =
      await file.arrayBuffer();

    const wb =
      XLSX.read(
        buf,
        {
          type:'array',
          cellDates:false
        }
      );

    if(!wb.SheetNames.length){

      throw new Error(
        'Excel没有工作表。'
      );
    }

    const ws =
      wb.Sheets[
        wb.SheetNames[0]
      ];

    return XLSX.utils.sheet_to_json(
      ws,
      {
        header:1,
        defval:'',
        raw:false
      }
    );
  }

  let text =
    await file.text();

  if(!text.trim()){

    throw new Error(
      '文件内容为空。'
    );
  }

  text =
    text.replace(
      /^\uFEFF/,
      ''
    );

  const first =
    text.split(/\r?\n/)[0]||'';

  let delim=',';

  if(first.includes('\t'))
    delim='\t';

  else if(first.includes(';'))
    delim=';';

  return parseDelimited(
    text,
    delim
  );
}

function normalizeHeader(v){

  return String(v??'')
    .replace(/^\uFEFF/,'')
    .trim()
    .toLowerCase()
    .replace(/\s+/g,'');
}

function headerMap(row){

  const m={};

  row.forEach(
    (v,i)=>{

      const k =
        normalizeHeader(v);

      if(k)
        m[k]=i;
    }
  );

  return m;
}

function pick(
  row,
  h,
  names
){

  for(
    const n of names
  ){

    const key =
      normalizeHeader(n);

    const i =
      h[key];

    if(i!==undefined){

      return String(
        row[i]??''
      ).trim();
    }
  }

  return '';
}

function importNumber(v){

  const s =
    String(v??'')
      .trim()
      .replace(/,/g,'');

  if(s==='')
    return 0;

  if(!/^\d+$/.test(s))
    return null;

  const n =
    Number(s);

  if(
    !Number.isSafeInteger(n) ||
    n<0
  )
    return null;

  return n;
}

function findHeader(h,names){

  return names.some(
    n=>
      h[
        normalizeHeader(n)
      ]!==undefined
  );
}

async function runImport(kind){

  const f =
    $('importFile')
      ?.files
      ?. [0];

  if(!f)
    return showError(
      '请选择文件'
    );

  try{

    const rows =
      await readRows(f);

    if(rows.length<2){

      throw new Error(
        '文件没有有效数据。'
      );
    }

    const h =
      headerMap(rows[0]);

    /* -----------------------------------------------------
       商品导入
       ----------------------------------------------------- */

    if(kind==='items'){

      if(
        !findHeader(
          h,
          ['名称','商品名称','name']
        )
      ){

        throw new Error(
          '没有找到“名称”表头。'
        );
      }

      if(
        !findHeader(
          h,
          ['sku','条码','barcode']
        )
      ){

        throw new Error(
          '没有找到“SKU”表头。'
        );
      }

      const existing =
        new Set(
          APP.inventory.map(
            x=>
              String(x.sku||'')
                .trim()
                .toLowerCase()
          )
        );

      const fileSkus =
        new Set();

      const prepared=[];
      const errors=[];

      for(
        let i=1;
        i<rows.length;
        i++
      ){

        const line =
          i+1;

        const r =
          rows[i];

        const name =
          pick(
            r,
            h,
            [
              '名称',
              '商品名称',
              'name'
            ]
          );

        const sku =
          pick(
            r,
            h,
            [
              'sku',
              '条码',
              'barcode'
            ]
          );

        const alertS =
          pick(
            r,
            h,
            [
              '低库存',
              '预警',
              'alert',
              'alert_qty'
            ]
          );

        const qtyS =
          pick(
            r,
            h,
            [
              '初始数量',
              '初始库存',
              '库存',
              '数量',
              'qty'
            ]
          );

        const bin =
          pick(
            r,
            h,
            [
              '货位',
              '库位',
              'bin'
            ]
          );

        if(!name){

          errors.push(
            `第${line}行：商品名称为空`
          );

          continue;
        }

        if(!sku){

          errors.push(
            `第${line}行：SKU为空`
          );

          continue;
        }

        const skuKey =
          sku
            .trim()
            .toLowerCase();

        if(existing.has(skuKey)){

          errors.push(
            `第${line}行：SKU已存在：${sku}`
          );

          continue;
        }

        if(fileSkus.has(skuKey)){

          errors.push(
            `第${line}行：文件内SKU重复：${sku}`
          );

          continue;
        }

        const alertQty =
          importNumber(
            alertS
          );

        const qty =
          importNumber(
            qtyS
          );

        if(alertQty===null){

          errors.push(
            `第${line}行：低库存数量不是有效整数`
          );

          continue;
        }

        if(qty===null){

          errors.push(
            `第${line}行：初始库存不是有效整数`
          );

          continue;
        }

        fileSkus.add(
          skuKey
        );

        prepared.push({
          line,
          name,
          sku,
          alertQty,
          qty,
          bin
        });
      }

      if(
        !prepared.length
      ){

        closeModal();

        alert(
          '没有可以导入的数据。\n\n'+
          errors.join('\n')
        );

        return;
      }

      const okRows=[];
      const failedRows=[
        ...errors
      ];

      for(
        const item of prepared
      ){

        try{

          const r =
            await APP.sb.rpc(
              'create_inventory',
              {
                p_warehouse_id:
                  APP.warehouse.id,

                p_name:
                  item.name,

                p_sku:
                  item.sku,

                p_qty:
                  item.qty,

                p_alert:
                  item.alertQty,

                p_bin:
                  item.bin
              }
            );

          if(r.error)
            throw r.error;

          okRows.push(
            item.line
          );

          existing.add(
            item.sku
              .trim()
              .toLowerCase()
          );

        }catch(e){

          failedRows.push(
            `第${item.line}行：${
              e?.message ||
              e?.details ||
              '数据库保存失败'
            }`
          );
        }
      }

      await loadInventory();

      closeModal();

      renderApp();

      let message =
        '📥 商品导入完成\n\n'+
        `成功：${okRows.length} 条\n`+
        `失败：${failedRows.length} 条`;

      if(failedRows.length){

        message +=
          '\n\n失败详情：\n'+
          failedRows.join('\n');
      }

      alert(message);

      return;
    }

    /* -----------------------------------------------------
       入库 / 出库导入
       ----------------------------------------------------- */

    if(
      !findHeader(
        h,
        ['sku','条码','barcode']
      )
    ){

      throw new Error(
        '没有找到“SKU”表头。'
      );
    }

    if(
      !findHeader(
        h,
        ['数量','qty','数量变动']
      )
    ){

      throw new Error(
        '没有找到“数量”表头。'
      );
    }

    const prepared=[];
    const errors=[];

    for(
      let i=1;
      i<rows.length;
      i++
    ){

      const line =
        i+1;

      const r =
        rows[i];

      const sku =
        pick(
          r,
          h,
          [
            'sku',
            '条码',
            'barcode'
          ]
        );

      const qtyS =
        pick(
          r,
          h,
          [
            '数量',
            'qty',
            '数量变动'
          ]
        );

      const note =
        pick(
          r,
          h,
          [
            '备注',
            'note'
          ]
        );

      if(!sku){

        errors.push(
          `第${line}行：SKU为空`
        );

        continue;
      }

      const qty =
        importNumber(
          qtyS
        );

      if(
        qty===null ||
        qty<1
      ){

        errors.push(
          `第${line}行：数量必须是大于0的整数`
        );

        continue;
      }

      const item =
        APP.inventory.find(
          x=>
            String(x.sku)
              .trim()
              .toLowerCase()
            ===
            sku
              .trim()
              .toLowerCase()
        );

      if(!item){

        errors.push(
          `第${line}行：找不到SKU：${sku}`
        );

        continue;
      }

      if(
        APP.stockType==='out' &&
        Number(item.qty)<qty
      ){

        errors.push(
          `第${line}行：库存不足，当前${item.qty}，需要出库${qty}`
        );

        continue;
      }

      prepared.push({
        line,
        item,
        qty,
        note
      });
    }

    if(!prepared.length){

      closeModal();

      alert(
        `没有可以执行的${APP.stockType==='in'?'入库':'出库'}数据。\n\n`+
        errors.join('\n')
      );

      return;
    }

    const okRows=[];
    const failedRows=[
      ...errors
    ];

    for(
      const item of prepared
    ){

      try{

        const r =
          await APP.sb.rpc(
            'adjust_inventory',
            {
              p_inventory_id:
                item.item.id,

              p_type:
                APP.stockType,

              p_qty:
                item.qty,

              p_note:
                item.note
            }
          );

        if(r.error)
          throw r.error;

        okRows.push(
          item.line
        );

      }catch(e){

        failedRows.push(
          `第${item.line}行：${
            e?.message ||
            e?.details ||
            '数据库保存失败'
          }`
        );
      }
    }

    await Promise.all([
      loadInventory(),
      loadLogs()
    ]);

    closeModal();

    renderApp();

    let message =
      `📦 批量${
        APP.stockType==='in'
        ?
        '入库'
        :
        '出库'
      }完成\n\n`+
      `成功：${okRows.length} 条\n`+
      `失败：${failedRows.length} 条`;

    if(failedRows.length){

      message +=
        '\n\n失败详情：\n'+
        failedRows.join('\n');
    }

    alert(message);

  }catch(e){

    showRealError(
      '批量导入失败',
      e
    );
  }
}

/* =========================================================
   扫码
   ========================================================= */

async function openScanner(mode){

  closeModal();

  APP.scannerMode=mode;

  modal(
    '扫码',
    `

    <div id="reader" class="w-full"></div>

    <div
      class="text-center text-sm text-gray-500 mt-3">

      请把条码/二维码放入框内。

      <br>

      扫码成功后会自动处理。

    </div>

    <button
      onclick="closeScanner()"
      class="w-full border rounded-xl py-3 mt-3">

      关闭相机

    </button>

    `
  );

  try{

    if(!window.Html5Qrcode){

      throw new Error(
        '扫码组件加载失败，请检查网络。'
      );
    }

    APP.scanner =
      new Html5Qrcode(
        'reader'
      );

    const cams =
      await Html5Qrcode.getCameras();

    if(!cams?.length){

      throw new Error(
        '没有检测到摄像头，请允许浏览器使用相机。'
      );
    }

    const back =
      cams.find(
        c=>
          /back|rear|environment|后置/i
            .test(c.label)
      )
      ||
      cams[cams.length-1];

    await APP.scanner.start(
      back.id,
      {
        fps:10,
        qrbox:{
          width:260,
          height:160
        }
      },
      decoded=>
        handleScan(decoded),
      ()=>{}
    );

    APP.scannerRunning=true;

  }catch(e){

    closeScanner();

    showRealError(
      '启动扫码失败',
      e
    );
  }
}

async function handleScan(decoded){

  if(!APP.scannerRunning)
    return;

  const code =
    String(decoded||'').trim();

  if(!code)
    return;

  const mode =
    APP.scannerMode;

  await closeScanner();

  if(mode==='fill-sku'){

    openItem(
      null,
      code
    );

    return;
  }

  if(mode==='find'){

    const item =
      APP.inventory.find(
        x=>
          String(x.sku)
            .trim()
            .toLowerCase()
          ===
          code.toLowerCase()
      );

    if(!item){

      alert(
        '未找到这个SKU：'+code
      );

      return;
    }

    APP.page='inventory';

    renderApp();

    setTimeout(
      ()=>{
        const inp =
          $('invSearch');

        if(inp){

          inp.value=code;

          renderInventoryList();
        }
      },
      50
    );

    alert(
      `找到商品：${item.name}\n`+
      `SKU：${item.sku}\n`+
      `货位：${item.bin||'未设置'}\n`+
      `库存：${item.qty}`
    );

    return;
  }

  if(mode==='stock-in'){

    openStock(
      'in',
      code
    );

    return;
  }

  if(mode==='stock-out'){

    openStock(
      'out',
      code
    );

    return;
  }
}

async function closeScanner(){

  if(APP.scanner){

    try{

      if(APP.scannerRunning){

        await APP.scanner.stop();
      }

    }catch(e){}

    try{

      await APP.scanner.clear();

    }catch(e){}

    APP.scanner=null;
  }

  APP.scannerRunning=false;

  APP.scannerMode=null;

  closeModal();
}

/* =========================================================
   备份
   ========================================================= */

function exportBackup(){

  if(!APP.warehouse)
    return;

  const data={

    exported_at:
      new Date().toISOString(),

    warehouse:
      APP.warehouse,

    inventory:
      APP.inventory,

    stock_logs:
      APP.logs

  };

  const blob =
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:'application/json'
      }
    );

  const a =
    document.createElement('a');

  a.href =
    URL.createObjectURL(
      blob
    );

  a.download =
    'warehouse-backup-'+
    new Date()
      .toISOString()
      .slice(0,10)+
    '.json';

  a.click();

  setTimeout(
    ()=>{
      URL.revokeObjectURL(
        a.href
      );
    },
    1000
  );
}

   退出
   ========================================================= */

async function logout(){

  cleanupRealtime();

  try{

    await APP.sb.auth.signOut();

  }catch(e){

    showRealError(
      '退出失败',
      e
    );
  }
}
