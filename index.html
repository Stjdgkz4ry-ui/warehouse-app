<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>智能仓库管理系统 V2</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{background:#f5f7fb;-webkit-tap-highlight-color:transparent}.safe{padding-bottom:env(safe-area-inset-bottom)}
input,button,select,textarea{font-size:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.modal-bg{background:rgba(0,0,0,.5)}.hide{display:none!important}.nav-active{color:#2563eb;font-weight:700}
</style>
</head>
<body class="text-gray-900">
<div id="app"></div>

<script>
'use strict';
const APP={sb:null,user:null,warehouse:null,warehouses:[],inventory:[],logs:[],role:'member',page:'home',authMode:'login',stockType:'in',realtime:null,scanner:null,scannerRunning:false,scannerMode:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const uuidLike=v=>typeof v==='string'&&/^[0-9a-f]{8}-[0-9a-f-]{27,36}$/i.test(v);
function getConfig(){
 const url=localStorage.getItem('supabase_url')||localStorage.getItem('SUPABASE_URL')||localStorage.getItem('supabaseUrl')||'';
 const key=localStorage.getItem('supabase_key')||localStorage.getItem('SUPABASE_KEY')||localStorage.getItem('supabaseKey')||localStorage.getItem('supabase_anon_key')||localStorage.getItem('supabase_publishable_key')||'';
 return {url:url.trim().replace(/\/$/,''),key:key.trim()};
}
function showError(msg){alert(msg||'操作失败');}
function showRealError(prefix,e){console.error(prefix,e);let m=e?.message||e?.error_description||e?.details||'未知错误';if(e?.hint)m+='\n提示：'+e.hint;if(e?.code)m+='\n代码：'+e.code;showError(prefix+'\n'+m)}
function rpcValue(data){
 if(data==null)return null;if(typeof data==='string')return data;if(Array.isArray(data))return rpcValue(data[0]);
 if(typeof data==='object')return data.id||data.warehouse_id||data.warehouseId||data.result||data.value||null;return null;
}
function initSupabase(){
 const c=getConfig();
 if(!c.url||!c.key){renderAuth();return false}
 try{APP.sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return true}
 catch(e){showRealError('云端初始化失败',e);return false}
}
function renderAuth(){
 $('app').innerHTML=`<div class="min-h-screen flex items-center justify-center p-5"><div class="card w-full max-w-md p-6"><div class="text-center mb-6"><div class="text-4xl mb-2">📦</div><h1 class="text-2xl font-bold">智能仓库管理系统 V2</h1><p class="text-gray-500 mt-2">云端共享 · 手机扫码 · 多人协作</p></div><div id="authMsg" class="hidden mb-4 rounded-xl p-3 text-sm"></div><div class="space-y-3"><input id="authEmail" type="email" autocomplete="email" placeholder="邮箱" class="w-full border rounded-xl px-4 py-3"><input id="authPwd" type="password" autocomplete="current-password" placeholder="密码（至少6位）" class="w-full border rounded-xl px-4 py-3"><button onclick="authSubmit()" class="w-full bg-blue-600 text-white rounded-xl py-3 font-bold">${APP.authMode==='login'?'登录':'注册'}</button><button onclick="toggleAuth()" class="w-full border rounded-xl py-3">${APP.authMode==='login'?'没有账号？注册':'已有账号？登录'}</button><button onclick="showConfig()" class="w-full text-blue-600 py-2">云端连接设置</button></div></div></div>`;
}
function toggleAuth(){APP.authMode=APP.authMode==='login'?'register':'login';renderAuth()}
function authMsg(text,ok=false){const e=$('authMsg');if(!e)return;e.textContent=text;e.className='mb-4 rounded-xl p-3 text-sm '+(ok?'bg-green-50 text-green-700':'bg-red-50 text-red-700')}
async function authSubmit(){
 if(!APP.sb){showConfig();return}const email=$('authEmail')?.value.trim(),pwd=$('authPwd')?.value;
 if(!email||!pwd)return authMsg('请输入邮箱和密码');if(pwd.length<6)return authMsg('密码至少6位');
 try{if(APP.authMode==='register'){const r=await APP.sb.auth.signUp({email,password:pwd,options:{emailRedirectTo:window.location.origin+window.location.pathname}});if(r.error)throw r.error;authMsg(r.data?.session?'注册成功，正在进入…':'注册成功！请先打开邮箱确认链接。',true)}else{const r=await APP.sb.auth.signInWithPassword({email,password:pwd});if(r.error)throw r.error;await bootUser()}}catch(e){showRealError(APP.authMode==='register'?'注册失败':'登录失败',e)}
}
function showConfig(){
 const c=getConfig();const url=prompt('Supabase Project URL（例如 https://xxxx.supabase.co）',c.url);if(url===null)return;const key=prompt('Supabase Publishable/Anon Key',c.key);if(key===null)return;
 localStorage.setItem('supabase_url',url.trim().replace(/\/$/,''));localStorage.setItem('supabase_key',key.trim());location.reload();
}
async function boot(){
 if(!initSupabase())return;
 APP.sb.auth.onAuthStateChange((event,session)=>{if(session?.user){APP.user=session.user;setTimeout(()=>bootUser(),0)}else if(event==='SIGNED_OUT'){APP.user=null;cleanupRealtime();renderAuth()}});
 const {data:{session}}=await APP.sb.auth.getSession();if(session){APP.user=session.user;await bootUser()}else renderAuth();
}
async function bootUser(){if(!APP.user||!APP.sb)return;await loadWarehouses();renderApp()}
async function loadWarehouses(){
 const {data:m,error:me}=await APP.sb.from('warehouse_members').select('warehouse_id,role').eq('user_id',APP.user.id);if(me)throw me;
 const ids=(m||[]).map(x=>x.warehouse_id).filter(Boolean);if(!ids.length){APP.warehouses=[];APP.warehouse=null;return}
 const {data:w,error:we}=await APP.sb.from('warehouses').select('*').in('id',ids);if(we)throw we;
 APP.warehouses=(w||[]).map(x=>({...x,role:(m||[]).find(mm=>mm.warehouse_id===x.id)?.role||'member'}));
 if(APP.warehouse){const nw=APP.warehouses.find(x=>x.id===APP.warehouse.id);APP.warehouse=nw||null;if(!nw)cleanupRealtime()}
}
async function selectWarehouse(id){
 const w=APP.warehouses.find(x=>x.id===id);if(!w)return;cleanupRealtime();APP.warehouse=w;APP.role=w.role||'member';APP.page='home';
 try{await Promise.all([loadInventory(),loadLogs()]);setupRealtime();renderApp()}catch(e){showRealError('读取仓库数据失败',e)}
}
async function loadInventory(){if(!APP.warehouse)return;const {data,error}=await APP.sb.from('inventory').select('*').eq('warehouse_id',APP.warehouse.id).order('created_at',{ascending:false});if(error)throw error;APP.inventory=data||[]}
async function loadLogs(){if(!APP.warehouse)return;const {data,error}=await APP.sb.from('stock_logs').select('*').eq('warehouse_id',APP.warehouse.id).order('created_at',{ascending:false}).limit(200);if(error)throw error;APP.logs=data||[]}
function setupRealtime(){
 cleanupRealtime();if(!APP.warehouse)return;const wid=APP.warehouse.id;
 APP.realtime=APP.sb.channel('warehouse-'+wid+'-'+Date.now()).on('postgres_changes',{event:'*',schema:'public',table:'inventory',filter:'warehouse_id=eq.'+wid},()=>loadInventory().then(()=>renderApp())).on('postgres_changes',{event:'*',schema:'public',table:'stock_logs',filter:'warehouse_id=eq.'+wid},()=>loadLogs().then(()=>renderApp())).subscribe();
}
function cleanupRealtime(){if(APP.realtime&&APP.sb){try{APP.sb.removeChannel(APP.realtime)}catch(e){}APP.realtime=null}}
function roleName(r){return r==='owner'?'所有者':r==='admin'?'管理员':'成员'}
function isAdmin(){return APP.role==='owner'||APP.role==='admin'}
function renderApp(){
 if(!APP.user)return renderAuth();
 const wh=APP.warehouse;
 $('app').innerHTML=`<div class="min-h-screen pb-24"><header class="bg-white border-b sticky top-0 z-20"><div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between"><div><div class="font-bold text-lg">📦 ${esc(wh?.name||'智能仓库')}</div><div class="text-xs text-gray-500">${esc(APP.user.email||'')} ${wh?`· ${roleName(APP.role)}`:''}</div></div><button onclick="openWarehousePicker()" class="border rounded-xl px-3 py-2 text-sm">${wh?'切换仓库':'选择仓库'}</button></div></header><main class="max-w-5xl mx-auto p-4" id="main"></main><nav class="fixed bottom-0 inset-x-0 bg-white border-t safe z-30"><div class="max-w-5xl mx-auto grid grid-cols-5 text-xs"><button onclick="go('home')" class="py-3 ${APP.page==='home'?'nav-active':''}">🏠<br>首页</button><button onclick="go('inventory')" class="py-3 ${APP.page==='inventory'?'nav-active':''}">📋<br>库存</button><button onclick="openStock('in')" class="py-3 text-green-600 font-bold">⬆️<br>入库</button><button onclick="openStock('out')" class="py-3 text-orange-600 font-bold">⬇️<br>出库</button><button onclick="go('settings')" class="py-3 ${APP.page==='settings'?'nav-active':''}">⚙️<br>设置</button></div></nav></div>`;
 renderPage();
}
function go(p){APP.page=p;renderApp()}
function renderPage(){const m=$('main');if(!APP.warehouse){m.innerHTML=emptyWarehouse();return}if(APP.page==='home')m.innerHTML=homeHtml();else if(APP.page==='inventory')m.innerHTML=inventoryHtml();else if(APP.page==='logs')m.innerHTML=logsHtml();else m.innerHTML=settingsHtml()}
function emptyWarehouse(){return `<div class="card p-6 text-center mt-5"><div class="text-5xl mb-3">🏭</div><h2 class="text-xl font-bold">还没有选择仓库</h2><p class="text-gray-500 my-3">创建新仓库或输入邀请码加入已有仓库。</p><div class="grid grid-cols-2 gap-3"><button onclick="createWarehouseDialog()" class="bg-blue-600 text-white rounded-xl py-3">创建仓库</button><button onclick="joinWarehouseDialog()" class="border rounded-xl py-3">加入仓库</button></div></div>`}
function homeHtml(){const total=APP.inventory.reduce((a,x)=>a+(Number(x.qty)||0),0),low=APP.inventory.filter(x=>Number(x.qty)<=Number(x.alert_qty||0));return `<div class="grid grid-cols-2 gap-3"><div class="card p-4"><div class="text-gray-500 text-sm">SKU种类</div><div class="text-3xl font-bold">${APP.inventory.length}</div></div><div class="card p-4"><div class="text-gray-500 text-sm">库存总数</div><div class="text-3xl font-bold">${total}</div></div><div class="card p-4"><div class="text-gray-500 text-sm">低库存</div><div class="text-3xl font-bold text-red-600">${low.length}</div></div><div class="card p-4"><div class="text-gray-500 text-sm">操作记录</div><div class="text-3xl font-bold">${APP.logs.length}</div></div></div><div class="grid grid-cols-2 gap-3 mt-4"><button onclick="openStock('in')" class="card p-5 text-left"><div class="text-3xl">⬆️</div><b>快速入库</b><div class="text-sm text-gray-500">支持扫码</div></button><button onclick="openStock('out')" class="card p-5 text-left"><div class="text-3xl">⬇️</div><b>快速出库</b><div class="text-sm text-gray-500">支持扫码</div></button><button onclick="openScanner('find')" class="card p-5 text-left"><div class="text-3xl">🔎</div><b>扫码找货</b><div class="text-sm text-gray-500">查SKU和货位</div></button><button onclick="openScanner('stock-in')" class="card p-5 text-left"><div class="text-3xl">📷</div><b>扫码入库</b><div class="text-sm text-gray-500">扫完直接入库</div></button></div><div class="card mt-4 p-4"><div class="flex justify-between items-center"><b>低库存提醒</b><button onclick="go('inventory')" class="text-blue-600 text-sm">查看全部</button></div>${low.length?low.slice(0,10).map(x=>`<div class="flex justify-between py-3 border-b last:border-0"><div><b>${esc(x.name)}</b><div class="text-xs text-gray-500">SKU ${esc(x.sku)} · 货位 ${esc(x.bin||'未设置')}</div></div><span class="text-red-600 font-bold">${x.qty}</span></div>`).join(''):'<div class="text-gray-500 py-4">暂无低库存商品</div>'}</div>`}
function inventoryHtml(){return `<div class="flex gap-2 mb-3"><button onclick="openItem()" class="flex-1 bg-blue-600 text-white rounded-xl py-3 font-bold">＋新增商品</button><button onclick="openImport('items')" class="flex-1 border rounded-xl py-3 font-bold">批量导入</button></div><div class="card p-3 mb-3"><input id="invSearch" oninput="renderInventoryList()" placeholder="搜索名称 / SKU / 货位 / SKU后3位" class="w-full border rounded-xl px-4 py-3"></div><div id="inventoryList"></div>`}
function renderInventoryList(){const box=$('inventoryList');if(!box)return;const q=($('invSearch')?.value||'').trim().toLowerCase();let arr=APP.inventory.filter(x=>!q||String(x.name||'').toLowerCase().includes(q)||String(x.sku||'').toLowerCase().includes(q)||String(x.bin||'').toLowerCase().includes(q)||String(x.sku||'').slice(-3).toLowerCase()===q);box.innerHTML=arr.length?arr.map(x=>{const low=Number(x.qty)<=Number(x.alert_qty||0);return `<div class="card p-4 mb-3"><div class="flex justify-between gap-3"><div class="min-w-0"><b class="text-lg">${esc(x.name)}</b><div class="text-sm text-gray-500 mt-1">SKU：${esc(x.sku)}</div><div class="text-sm text-gray-500">货位：<b>${esc(x.bin||'未设置')}</b></div></div><div class="text-right"><div class="text-2xl font-bold ${low?'text-red-600':''}">${x.qty}</div><div class="text-xs ${low?'text-red-600':'text-gray-500'}">${low?'低库存':'库存'}</div></div></div><div class="grid grid-cols-3 gap-2 mt-3"><button onclick="openStock('in','${esc(x.sku)}')" class="bg-green-50 text-green-700 rounded-lg py-2">入库</button><button onclick="openStock('out','${esc(x.sku)}')" class="bg-orange-50 text-orange-700 rounded-lg py-2">出库</button><button onclick="openItem('${x.id}')" class="border rounded-lg py-2">编辑</button></div></div>`}).join(''):'<div class="card p-6 text-center text-gray-500">没有找到商品</div>'}
function logsHtml(){return `<div class="card p-4"><div class="flex justify-between"><b>操作记录</b><button onclick="exportBackup()" class="text-blue-600 text-sm">备份</button></div>${APP.logs.length?APP.logs.map(l=>`<div class="py-3 border-b last:border-0"><div class="flex justify-between"><b>${l.type==='in'?'入库':'出库'} ${l.qty}</b><span class="text-xs text-gray-500">${fmt(l.created_at)}</span></div><div class="text-sm text-gray-600">SKU：${esc(l.sku||'')} ${l.note?'· '+esc(l.note):''}</div></div>`).join(''):'<div class="py-6 text-gray-500 text-center">暂无记录</div>'}</div>`}
function settingsHtml(){return `<div class="space-y-3"><div class="card p-4"><b>账号</b><div class="text-sm text-gray-500 mt-2">${esc(APP.user.email||'')} · ${roleName(APP.role)}</div></div><div class="card p-4"><b>当前仓库</b><div class="mt-2">${esc(APP.warehouse.name)}</div><div class="text-sm text-gray-500 mt-1">邀请码：<b>${esc(APP.warehouse.join_code||'未显示')}</b></div></div>${isAdmin()?`<div class="card p-4"><b>仓库管理</b><div class="grid grid-cols-2 gap-2 mt-3"><button onclick="createWarehouseDialog()" class="border rounded-xl py-3">创建仓库</button><button onclick="joinWarehouseDialog()" class="border rounded-xl py-3">加入仓库</button></div></div>`:''}<button onclick="go('logs')" class="w-full card p-4 text-left">📜 操作日志</button><button onclick="exportBackup()" class="w-full card p-4 text-left">💾 导出云端备份</button><button onclick="showConfig()" class="w-full card p-4 text-left">☁️ 修改云端连接</button><button onclick="logout()" class="w-full bg-red-600 text-white rounded-xl py-3 font-bold">退出登录</button></div>`}
function fmt(v){try{return new Date(v).toLocaleString('zh-CN')}catch(e){return v||''}}
function openWarehousePicker(){let html=`<div class="space-y-3">${APP.warehouses.map(w=>`<button onclick="selectWarehouse('${w.id}');closeModal()" class="w-full border rounded-xl p-4 text-left"><b>${esc(w.name)}</b><div class="text-sm text-gray-500">${roleName(w.role)} · 邀请码 ${esc(w.join_code||'')}</div></button>`).join('')||'<div class="text-gray-500">暂无仓库</div>'}<div class="grid grid-cols-2 gap-2"><button onclick="closeModal();createWarehouseDialog()" class="bg-blue-600 text-white rounded-xl py-3">创建</button><button onclick="closeModal();joinWarehouseDialog()" class="border rounded-xl py-3">加入</button></div></div>`;modal('选择仓库',html)}
function modal(title,body){closeModal();const d=document.createElement('div');d.id='modal';d.className='fixed inset-0 z-50 modal-bg flex items-end sm:items-center justify-center p-3';d.innerHTML=`<div class="bg-white rounded-2xl w-full max-w-lg max-h-[90vh] overflow-auto p-5"><div class="flex justify-between items-center mb-4"><h2 class="text-xl font-bold">${title}</h2><button onclick="closeModal()" class="text-2xl">×</button></div>${body}</div>`;document.body.appendChild(d)}
function closeModal(){document.getElementById('modal')?.remove()}
function createWarehouseDialog(){modal('创建仓库',`<input id="whName" class="w-full border rounded-xl px-4 py-3" placeholder="仓库名称"><button onclick="createWarehouse()" class="w-full bg-blue-600 text-white rounded-xl py-3 mt-3 font-bold">创建</button>`)}
function joinWarehouseDialog(){modal('加入仓库',`<input id="joinCode" maxlength="6" inputmode="numeric" class="w-full border rounded-xl px-4 py-3" placeholder="输入6位邀请码"><button onclick="joinWarehouse()" class="w-full bg-blue-600 text-white rounded-xl py-3 mt-3 font-bold">加入</button>`)}
async function createWarehouse(){const name=$('whName')?.value.trim();if(!name)return showError('请输入仓库名称');try{const r=await APP.sb.rpc('create_warehouse',{p_name:name});if(r.error)throw r.error;const id=rpcValue(r.data);await loadWarehouses();let w=id&&APP.warehouses.find(x=>x.id===id);if(!w)w=APP.warehouses.find(x=>x.name===name);closeModal();if(w)await selectWarehouse(w.id);else{renderApp();alert('仓库创建成功，但列表暂时没有显示。请刷新页面后再选择。')}}catch(e){showRealError('创建仓库失败',e)}}
async function joinWarehouse(){const code=$('joinCode')?.value.trim();if(!/^\d{6}$/.test(code))return showError('请输入6位数字邀请码');try{const r=await APP.sb.rpc('join_warehouse',{p_join_code:code});if(r.error)throw r.error;const id=rpcValue(r.data);await loadWarehouses();let w=id&&APP.warehouses.find(x=>x.id===id);closeModal();if(w)await selectWarehouse(w.id);else{renderApp();alert('加入成功，请刷新仓库列表。')}}catch(e){showRealError('加入仓库失败',e)}}
function openItem(id=null,sku=''){const x=id?APP.inventory.find(a=>a.id===id):null;modal(x?'编辑商品':'新增商品',`<div class="space-y-3"><input id="itemName" value="${esc(x?.name||'')}" placeholder="商品名称" class="w-full border rounded-xl px-4 py-3"><div class="flex gap-2"><input id="itemSku" value="${esc(x?.sku||sku)}" placeholder="SKU / 条码" class="flex-1 border rounded-xl px-4 py-3"><button onclick="openScanner('fill-sku')" class="border rounded-xl px-4">📷</button></div><input id="itemAlert" type="number" min="0" step="1" value="${Number(x?.alert_qty||0)}" placeholder="低库存提醒数量" class="w-full border rounded-xl px-4 py-3"><input id="itemBin" value="${esc(x?.bin||'')}" placeholder="货位，例如 A-01-02" class="w-full border rounded-xl px-4 py-3">${x?'':`<input id="itemQty" type="number" min="0" step="1" value="0" placeholder="初始库存数量" class="w-full border rounded-xl px-4 py-3">`}<button onclick="saveItem('${id||''}')" class="w-full bg-blue-600 text-white rounded-xl py-3 font-bold">保存</button></div>`)}
function intVal(v){const n=Number(v);return Number.isInteger(n)&&n>=0?n:null}
async function saveItem(id){const name=$('itemName')?.value.trim(),sku=$('itemSku')?.value.trim(),alertQty=intVal($('itemAlert')?.value),bin=$('itemBin')?.value.trim();if(!name||!sku)return showError('商品名称和SKU不能为空');if(alertQty===null)return showError('低库存数量必须是非负整数');if(!id){const qty=intVal($('itemQty')?.value);if(qty===null)return showError('初始库存必须是非负整数');if(APP.inventory.some(x=>String(x.sku).trim().toLowerCase()===sku.toLowerCase()))return showError('当前仓库已经存在这个SKU');try{const r=await APP.sb.rpc('create_inventory',{p_warehouse_id:APP.warehouse.id,p_name:name,p_sku:sku,p_qty:qty,p_alert:alertQty,p_bin:bin});if(r.error)throw r.error;await loadInventory();closeModal();renderApp()}catch(e){showRealError('新增商品失败',e)}}else{const dup=APP.inventory.find(x=>x.id!==id&&String(x.sku).trim().toLowerCase()===sku.toLowerCase());if(dup)return showError('当前仓库已经存在这个SKU');try{const r=await APP.sb.rpc('update_inventory_info',{p_inventory_id:id,p_name:name,p_sku:sku,p_alert:alertQty,p_bin:bin});if(r.error)throw r.error;await loadInventory();closeModal();renderApp()}catch(e){showRealError('保存商品失败',e)}}}
function openStock(type='in',sku=''){APP.stockType=type;modal(type==='in'?'入库':'出库',`<div class="space-y-3"><div class="flex gap-2"><input id="stockSku" value="${esc(sku)}" placeholder="SKU / 条码" class="flex-1 border rounded-xl px-4 py-3"><button onclick="openScanner('${type==='in'?'stock-in':'stock-out'}')" class="border rounded-xl px-4">📷</button></div><input id="stockQty" type="number" min="1" step="1" value="1" placeholder="数量" class="w-full border rounded-xl px-4 py-3"><input id="stockNote" placeholder="备注（可选）" class="w-full border rounded-xl px-4 py-3"><button onclick="saveStock()" class="w-full ${type==='in'?'bg-green-600':'bg-orange-600'} text-white rounded-xl py-3 font-bold">确认${type==='in'?'入库':'出库'}</button><button onclick="openImport('stock')" class="w-full border rounded-xl py-3">📁 批量${type==='in'?'入库':'出库'}</button></div>`)}
async function saveStock(){const sku=$('stockSku')?.value.trim(),qty=intVal($('stockQty')?.value),note=$('stockNote')?.value.trim()||'';if(!sku)return showError('请输入或扫描SKU');if(!qty||qty<1)return showError('数量必须是大于0的整数');const item=APP.inventory.find(x=>String(x.sku).trim().toLowerCase()===sku.toLowerCase());if(!item){if(APP.stockType==='in'){closeModal();openItem(null,sku);alert('这个条码还没有商品资料。已把扫描到的SKU填入新增商品，请填写名称、货位和初始库存。')}else showError('出库失败：找不到这个SKU');return}if(APP.stockType==='out'&&Number(item.qty)<qty)return showError(`库存不足。当前库存：${item.qty}`);try{const r=await APP.sb.rpc('adjust_inventory',{p_inventory_id:item.id,p_type:APP.stockType,p_qty:qty,p_note:note});if(r.error)throw r.error;await Promise.all([loadInventory(),loadLogs()]);closeModal();renderApp()}catch(e){showRealError('库存调整失败',e)}}
function openImport(kind){const title=kind==='items'?'批量导入商品':`批量${APP.stockType==='in'?'入库':'出库'}`;modal(title,`<div class="text-sm text-gray-600 mb-3">支持 CSV / TXT / TSV / XLSX / XLS。第一行必须是表头。SKU请在Excel中设置为“文本”，避免前导0丢失。</div><input id="importFile" type="file" accept=".csv,.txt,.tsv,.xlsx,.xls" class="w-full border rounded-xl p-3"><button onclick="runImport('${kind}')" class="w-full bg-blue-600 text-white rounded-xl py-3 mt-3 font-bold">开始导入</button><div class="mt-4 text-xs text-gray-500">商品表头示例：名称, SKU, 低库存, 初始数量, 货位<br>库存表头示例：SKU, 数量, 备注</div>`)}
function parseDelimited(text){const rows=[];let row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(quote&&n==='"'){cell+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(v=>String(v).trim()!==''))rows.push(row);row=[]}else cell+=c}if(cell!==''||row.length){row.push(cell);if(row.some(v=>String(v).trim()!==''))rows.push(row)}return rows}
async function readRows(file){const name=file.name.toLowerCase();if(name.endsWith('.xlsx')||name.endsWith('.xls')){if(!window.XLSX)throw new Error('Excel解析组件加载失败，请检查网络');const buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:'array',cellDates:false});const ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false})}const text=await file.text();let delim=';';const first=text.split(/\r?\n/)[0]||'';if(first.includes('\t'))delim='\t';else if(first.includes(','))delim=',';const rows=parseDelimited(delim===','?text:text.replaceAll(delim,','));return rows}
function headerMap(row){const m={};row.forEach((v,i)=>m[String(v??'').trim().toLowerCase()]=i);return m}
function pick(row,h,names){for(const n of names){const i=h[n.toLowerCase()];if(i!==undefined)return String(row[i]??'').trim()}return ''}
async function runImport(kind){const f=$('importFile')?.files?.[0];if(!f)return showError('请选择文件');try{const rows=await readRows(f);if(rows.length<2)throw new Error('文件没有有效数据');const h=headerMap(rows[0]);if(kind==='items'){let ok=0,bad=[];for(let i=1;i<rows.length;i++){const r=rows[i],name=pick(r,h,['名称','商品名称','name']),sku=pick(r,h,['sku','条码','barcode']),alertS=pick(r,h,['低库存','预警','alert','alert_qty']),qtyS=pick(r,h,['初始数量','库存','数量','qty']),bin=pick(r,h,['货位','库位','bin']);if(!name||!sku){bad.push(i+1);continue}const alertQty=intVal(alertS===''?0:alertS),qty=intVal(qtyS===''?0:qtyS);if(alertQty===null||qty===null||APP.inventory.some(x=>String(x.sku).trim().toLowerCase()===sku.toLowerCase())){bad.push(i+1);continue}const r1=await APP.sb.rpc('create_inventory',{p_warehouse_id:APP.warehouse.id,p_name:name,p_sku:sku,p_qty:qty,p_alert:alertQty,p_bin:bin});if(r1.error){bad.push(i+1);continue}ok++}await loadInventory();closeModal();renderApp();alert(`导入完成：成功 ${ok} 条，失败 ${bad.length} 条${bad.length?'。失败行：'+bad.join(','):''}`)}else{let ok=0,bad=[];for(let i=1;i<rows.length;i++){const r=rows[i],sku=pick(r,h,['sku','条码','barcode']),qtyS=pick(r,h,['数量','qty','数量变动']),note=pick(r,h,['备注','note']);const qty=intVal(qtyS);const item=APP.inventory.find(x=>String(x.sku).trim().toLowerCase()===sku.toLowerCase());if(!item||!qty||qty<1||(APP.stockType==='out'&&Number(item.qty)<qty)){bad.push(i+1);continue}const r1=await APP.sb.rpc('adjust_inventory',{p_inventory_id:item.id,p_type:APP.stockType,p_qty:qty,p_note:note});if(r1.error){bad.push(i+1);continue}ok++}await Promise.all([loadInventory(),loadLogs()]);closeModal();renderApp();alert(`批量${APP.stockType==='in'?'入库':'出库'}完成：成功 ${ok} 条，失败 ${bad.length} 条${bad.length?'。失败行：'+bad.join(','):''}`)}}catch(e){showRealError('批量导入失败',e)}}
async function openScanner(mode){
 closeModal();APP.scannerMode=mode;modal('扫码',`<div id="reader" class="w-full"></div><div class="text-center text-sm text-gray-500 mt-3">请把条码/二维码放入框内。扫码成功后会自动处理。</div><button onclick="closeScanner()" class="w-full border rounded-xl py-3 mt-3">关闭相机</button>`);
 try{if(!window.Html5Qrcode)throw new Error('扫码组件加载失败，请检查网络');APP.scanner=new Html5Qrcode('reader');const cams=await Html5Qrcode.getCameras();if(!cams?.length)throw new Error('没有检测到摄像头，请允许浏览器使用相机');const back=cams.find(c=>/back|rear|environment|后置/i.test(c.label))||cams[cams.length-1];await APP.scanner.start(back.id,{fps:10,qrbox:{width:260,height:160}},decoded=>handleScan(decoded),()=>{});APP.scannerRunning=true}catch(e){closeScanner();showRealError('启动扫码失败',e)}}
async function handleScan(decoded){if(!APP.scannerRunning)return;const code=String(decoded||'').trim();if(!code)return;const mode=APP.scannerMode;await closeScanner();if(mode==='fill-sku'){openItem(null,code);return}if(mode==='find'){const item=APP.inventory.find(x=>String(x.sku).trim().toLowerCase()===code.toLowerCase());if(!item){alert('未找到这个SKU：'+code);return}APP.page='inventory';renderApp();setTimeout(()=>{const inp=$('invSearch');if(inp){inp.value=code;renderInventoryList()}},50);alert(`找到商品：${item.name}\nSKU：${item.sku}\n货位：${item.bin||'未设置'}\n库存：${item.qty}`);return}if(mode==='stock-in'){openStock('in',code);return}if(mode==='stock-out'){openStock('out',code);return}}
async function closeScanner(){if(APP.scanner){try{if(APP.scannerRunning)await APP.scanner.stop()}catch(e){}try{await APP.scanner.clear()}catch(e){}APP.scanner=null}APP.scannerRunning=false;APP.scannerMode=null;closeModal()}
function exportBackup(){if(!APP.warehouse)return;const data={exported_at:new Date().toISOString(),warehouse:APP.warehouse,inventory:APP.inventory,stock_logs:APP.logs};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='warehouse-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function logout(){cleanupRealtime();try{await APP.sb.auth.signOut()}catch(e){showRealError('退出失败',e)}}
window.addEventListener('beforeunload',cleanupRealtime);
window.addEventListener('load',()=>boot());
</script>
