<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2563eb">
<title>云端仓库管理系统</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f3f4f6;
  color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
.page{max-width:900px;margin:auto;padding-bottom:90px}
.card{
  background:#fff;
  border-radius:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}
.navbtn{
  flex:1;
  padding:10px 4px;
  border:0;
  background:transparent;
  color:#6b7280;
  font-size:12px;
}
.navbtn.active{color:#2563eb;font-weight:700}
.navicon{font-size:20px;display:block;line-height:22px}
input,select,textarea{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:11px 12px;
  background:#fff;
  outline:none;
}
input:focus,select:focus,textarea:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 2px rgba(37,99,235,.12);
}
.btn{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  font-weight:600;
}
.btn-primary{background:#2563eb;color:#fff}
.btn-success{background:#16a34a;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-gray{background:#e5e7eb;color:#111827}
.btn-orange{background:#f59e0b;color:#fff}
.btn-small{padding:7px 10px;font-size:13px}
.badge{
  display:inline-block;
  padding:3px 8px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}
.badge-blue{background:#dbeafe;color:#1d4ed8}
.badge-green{background:#dcfce7;color:#15803d}
.badge-red{background:#fee2e2;color:#b91c1c}
.badge-gray{background:#f3f4f6;color:#4b5563}
.item-row{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:13px;
  margin-bottom:10px;
}
.bin-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:9px 0;
  border-bottom:1px solid #f0f0f0;
}
.bin-row:last-child{border-bottom:0}
.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  background:#fff;
  border-top:1px solid #e5e7eb;
  box-shadow:0 -3px 15px rgba(0,0,0,.06);
}
.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.48);
  z-index:100;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}
.modal{
  width:100%;
  max-width:700px;
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:20px 20px 0 0;
  padding:18px;
}
@media(min-width:700px){
 .modal-bg{align-items:center}
 .modal{border-radius:18px}
}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{
  border-bottom:1px solid #e5e7eb;
  padding:9px 7px;
  text-align:left;
  white-space:nowrap;
}
th{background:#f9fafb}
.stat{
  border-radius:14px;
  padding:14px;
}
.stat-number{font-size:25px;font-weight:800}
.hidden{display:none!important}
.small{font-size:12px;color:#6b7280}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.section-title{font-size:18px;font-weight:800}
</style>
</head>
<body>
<div id="app"></div>
<script>
const APP_VERSION = "V2.5-20260912";
const SUPABASE_URL = "https://veqzicbdvodonkbsbyrt.supabase.co";
const SUPABASE_KEY = "sb_publishable_njvb3co4PlkaWTAphXSW4g_IdSynRe-";
const {createClient} = supabase;
const sb = createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser = null;
let currentWarehouse = null;
let warehouses = [];
let inventory = [];
let logs = [];
let currentPage = "home";
let scanner = null;
let outboundRows = [];
let pickingRows = [];
const app = document.getElementById("app");
function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
function toast(msg,type="info"){
  const el=document.createElement("div");
  el.style.position="fixed";
  el.style.left="50%";
  el.style.top="18px";
  el.style.transform="translateX(-50%)";
  el.style.zIndex="9999";
  el.style.maxWidth="90%";
  el.style.padding="12px 16px";
  el.style.borderRadius="12px";
  el.style.color="#fff";
  el.style.fontWeight="600";
  el.style.boxShadow="0 5px 20px rgba(0,0,0,.2)";
  el.style.background=
    type==="error" ? "#dc2626" :
    type==="success" ? "#16a34a" : "#2563eb";
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2800);
}
function loading(msg="正在处理..."){
  const old=document.getElementById("loadingBox");
  if(old) old.remove();
  const el=document.createElement("div");
  el.id="loadingBox";
  el.style.position="fixed";
  el.style.inset="0";
  el.style.background="rgba(255,255,255,.75)";
  el.style.zIndex="9998";
  el.style.display="flex";
  el.style.alignItems="center";
  el.style.justifyContent="center";
  el.innerHTML=
    `<div class="card" style="padding:22px 28px;font-weight:700">${esc(msg)}</div>`;
  document.body.appendChild(el);
}
function hideLoading(){
  document.getElementById("loadingBox")?.remove();
}
function formatDate(v){
  if(!v)return "";
  try{
    return new Date(v).toLocaleString("zh-CN");
  }catch{
    return v;
  }
}
function activeInventory(){
  return inventory.filter(x=>x.is_active!==false);
}
function totalQty(){
  return activeInventory().reduce((s,x)=>s+Number(x.qty||0),0);
}
function skuCount(){
  return new Set(
    activeInventory()
      .map(x=>String(x.sku||"").trim())
      .filter(Boolean)
  ).size;
}
function lowCount(){
  return activeInventory().filter(x=>{
    const alert=Number(x.alert ?? 10);
    return Number(x.qty||0)<=alert;
  }).length;
}
function warehouseName(id){
  return warehouses.find(x=>x.id===id)?.name || "当前仓库";
}
function memberRole(){
  return "member";
}
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  currentUser=session?.user || null;
  sb.auth.onAuthStateChange((_event,session)=>{
    currentUser=session?.user || null;
    if(currentUser){
      boot();
    }else{
      renderLogin();
    }
  });
  if(currentUser) await boot();
  else renderLogin();
}
async function boot(){
  await loadWarehouses();
  if(!currentWarehouse && warehouses.length){
    currentWarehouse=warehouses[0];
  }
  if(!currentWarehouse){
    renderWarehouseSetup();
    return;
  }
  await refreshAll();
  subscribeRealtime();
  render();
}
async function loadWarehouses(){
  const {data,error}=await sb
    .from("warehouse_members")
    .select("warehouse_id,role,warehouses(id,name,join_code,owner_id,created_at)")
    .eq("user_id",currentUser.id);
  if(error){
    console.error(error);
    toast(error.message,"error");
    return;
  }
  warehouses=(data||[])
    .map(x=>x.warehouses)
    .filter(Boolean);
  const saved=localStorage.getItem("currentWarehouseId");
  if(saved){
    currentWarehouse=
      warehouses.find(x=>x.id===saved) || warehouses[0] || null;
  }else{
    currentWarehouse=warehouses[0] || null;
  }
}
async function refreshAll(){
  if(!currentWarehouse)return;
  await Promise.all([
    loadInventory(),
    loadLogs()
  ]);
  render();
}
async function loadInventory(){
  const {data,error}=await sb
    .from("inventory")
    .select("*")
    .eq("warehouse_id",currentWarehouse.id)
    .order("sku",{ascending:true})
    .order("bin",{ascending:true});
  if(error){
    console.error(error);
    toast("读取库存失败："+error.message,"error");
    return;
  }
  inventory=data||[];
}
async function loadLogs(){
  const {data,error}=await sb
    .from("stock_logs")
    .select("*")
    .eq("warehouse_id",currentWarehouse.id)
    .order("created_at",{ascending:false})
    .limit(500);
  if(error){
    console.error(error);
    logs=[];
    return;
  }
  logs=data||[];
}
let realtimeStarted=false;
function subscribeRealtime(){
  if(realtimeStarted)return;
  realtimeStarted=true;
  sb.channel("warehouse-live")
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"inventory"
      },
      async payload=>{
        if(payload.new?.warehouse_id===currentWarehouse?.id ||
           payload.old?.warehouse_id===currentWarehouse?.id){
          await loadInventory();
          render();
        }
      }
    )
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"stock_logs"
      },
      async payload=>{
        if(payload.new?.warehouse_id===currentWarehouse?.id ||
           payload.old?.warehouse_id===currentWarehouse?.id){
          await loadLogs();
          render();
        }
      }
    )
    .subscribe();
}
function render(){
  if(!currentUser){
    renderLogin();
    return;
  }
  if(!currentWarehouse){
    renderWarehouseSetup();
    return;
  }
  app.innerHTML=`
    <div class="page">
      <header style="padding:15px 15px 8px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <div>
            <div style="font-size:22px;font-weight:900">云端仓库管理系统</div>
            <div class="small">${esc(currentWarehouse.name)} · ${APP_VERSION}</div>
          </div>
          <button class="btn btn-gray btn-small" onclick="openWarehouseSwitcher()">切换仓库</button>
        </div>
      </header>
      <main style="padding:8px 15px 20px">
        ${pageHTML()}
      </main>
    </div>
    <nav class="bottom-nav">
      <div style="max-width:900px;margin:auto;display:flex">
        ${navButton("home","首页","⌂")}
        ${navButton("inventory","库存","▣")}
        ${navButton("outbound","快速出库","⇩")}
        ${navButton("logs","日志","≡")}
        ${navButton("settings","设置","⚙")}
      </div>
    </nav>
  `;
}
function navButton(page,text,icon){
  return `
    <button class="navbtn ${currentPage===page?"active":""}" onclick="goPage('${page}')">
      <span class="navicon">${icon}</span>${text}
    </button>
  `;
}
function goPage(p){
  currentPage=p;
  render();
  window.scrollTo(0,0);
}
function pageHTML(){
  if(currentPage==="home")return homePage();
  if(currentPage==="inventory")return inventoryPage();
  if(currentPage==="outbound")return outboundPage();
  if(currentPage==="logs")return logsPage();
  return settingsPage();
}
function homePage(){
  return `
    <div class="card" style="padding:18px;margin-bottom:12px">
      <div style="font-size:15px;font-weight:700">仓库概况</div>
      <div class="small" style="margin-top:5px">
        ${esc(currentWarehouse.name)}
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px">
        <div class="stat" style="background:#eff6ff">
          <div class="small">SKU种类</div>
          <div class="stat-number">${skuCount()}</div>
        </div>
        <div class="stat" style="background:#f0fdf4">
          <div class="small">库存总数量</div>
          <div class="stat-number">${totalQty()}</div>
        </div>
        <div class="stat" style="background:#fff7ed">
          <div class="small">低库存</div>
          <div class="stat-number">${lowCount()}</div>
        </div>
        <div class="stat" style="background:#fdf2f8">
          <div class="small">库存记录</div>
          <div class="stat-number">${activeInventory().length}</div>
        </div>
      </div>
    </div>
    <div class="card" style="padding:18px">
      <div class="section-title">常用操作</div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px">
        <button class="btn btn-primary" onclick="openItem()">＋ 新增库存</button>
        <button class="btn btn-success" onclick="openStockIn()">入库</button>
        <button class="btn btn-orange" onclick="goPage('outbound')">批量出库</button>
        <button class="btn btn-gray" onclick="openScannerForSearch()">扫码查找</button>
      </div>
    </div>
    <div class="card" style="padding:18px;margin-top:12px">
      <div class="section-title">低库存提醒</div>
      <div style="margin-top:10px">
        ${
          activeInventory()
          .filter(x=>Number(x.qty||0)<=Number(x.alert??10))
          .slice(0,8)
          .map(x=>`
            <div class="bin-row">
              <div>
                <div style="font-weight:700">${esc(x.name||x.sku)}</div>
                <div class="small">${esc(x.sku)} · ${esc(x.bin||"未分配")}</div>
              </div>
              <span class="badge badge-red">${Number(x.qty||0)} 件</span>
            </div>
          `).join("")
          || `<div class="small">目前没有低库存商品</div>`
        }
      </div>
    </div>
  `;
}
let inventoryKeyword="";
function inventoryPage(){
  const keyword=inventoryKeyword.trim().toLowerCase();
  let rows=activeInventory();
  if(keyword){
    rows=rows.filter(x=>
      String(x.sku||"").toLowerCase().includes(keyword) ||
      String(x.name||"").toLowerCase().includes(keyword) ||
      String(x.bin||"").toLowerCase().includes(keyword)
    );
  }
  /*
    关键变化：
    同 SKU 不再当成一个库存记录。
    先按照 SKU 分组，然后显示：
    总库存 + 每个库位。
  */
  const groups=new Map();
  rows.forEach(x=>{
    const key=String(x.sku||"").trim() || `__${x.id}`;
    if(!groups.has(key)){
      groups.set(key,{
        sku:key,
        name:x.name||key,
        rows:[]
      });
    }
    groups.get(key).rows.push(x);
  });
  return `
    <div class="card" style="padding:14px;margin-bottom:12px">
      <div style="display:flex;gap:8px">
        <input
          id="inventorySearch"
          value="${esc(inventoryKeyword)}"
          placeholder="搜索名称 / SKU / 库位"
          oninput="inventoryKeyword=this.value;renderInventoryOnly()"
        >
        <button class="btn btn-gray" onclick="openScannerForSearch()">扫码</button>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn btn-primary btn-small" onclick="openItem()">＋ 新增</button>
        <button class="btn btn-gray btn-small" onclick="openImport()">批量导入库存</button>
      </div>
    </div>
    <div id="inventoryList">
      ${inventoryGroupsHTML(groups)}
    </div>
  `;
}
function inventoryGroupsHTML(groups){
  if(!groups.size){
    return `
      <div class="card" style="padding:30px;text-align:center;color:#6b7280">
        没有找到库存
      </div>
    `;
  }
  return [...groups.values()].map(g=>{
    const total=g.rows.reduce((s,x)=>s+Number(x.qty||0),0);
    return `
      <div class="card item-row">
        <div style="display:flex;justify-content:space-between;gap:10px">
          <div>
            <div style="font-size:16px;font-weight:800">
              ${esc(g.name||g.sku)}
            </div>
            <div class="small mono">${esc(g.sku)}</div>
          </div>
          <div style="text-align:right">
            <div class="small">总库存</div>
            <div style="font-size:20px;font-weight:900">${total}</div>
          </div>
        </div>
        <div style="margin-top:8px">
          ${g.rows.map(x=>{
            const alert=Number(x.alert??10);
            const low=Number(x.qty||0)<=alert;
            return `
              <div class="bin-row">
                <div style="min-width:0">
                  <div style="font-weight:700">
                    库位：${esc(x.bin||"未分配")}
                  </div>
                  <div class="small">
                    库存 ${Number(x.qty||0)}
                    ${low ? " · 低库存" : ""}
                  </div>
                </div>
                <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end">
                  <button class="btn btn-success btn-small"
                    onclick="openStockModal('${x.id}','in')">入库</button>
                  <button class="btn btn-orange btn-small"
                    onclick="openStockModal('${x.id}','out')">出库</button>
                  <button class="btn btn-gray btn-small"
                    onclick="openItem('${x.id}')">编辑</button>
                  <button class="btn btn-gray btn-small"
                    onclick="archiveItem('${x.id}')">下架</button>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      </div>
    `;
  }).join("");
}
function renderInventoryOnly(){
  const box=document.getElementById("inventoryList");
  if(!box)return;
  const keyword=inventoryKeyword.trim().toLowerCase();
  let rows=activeInventory();
  if(keyword){
    rows=rows.filter(x=>
      String(x.sku||"").toLowerCase().includes(keyword) ||
      String(x.name||"").toLowerCase().includes(keyword) ||
      String(x.bin||"").toLowerCase().includes(keyword)
    );
  }
  const groups=new Map();
  rows.forEach(x=>{
    const key=String(x.sku||"").trim() || `__${x.id}`;
    if(!groups.has(key)){
      groups.set(key,{
        sku:key,
        name:x.name||key,
        rows:[]
      });
    }
    groups.get(key).rows.push(x);
  });
  box.innerHTML=inventoryGroupsHTML(groups);
}
async function openItem(id=null){
  const x=id ? inventory.find(a=>a.id===id) : null;
  showModal(`
    <div class="section-title">${x?"编辑库存":"新增库存"}</div>
    <div style="margin-top:15px">
      <label class="small">商品名称</label>
      <input id="itemName" value="${esc(x?.name||"")}" placeholder="可不填写，不填写则使用 SKU">
    </div>
    <div style="margin-top:12px">
      <label class="small">SKU *</label>
      <div style="display:flex;gap:8px">
        <input id="itemSku" value="${esc(x?.sku||"")}" placeholder="例如 COKE001">
        <button class="btn btn-gray" onclick="openScannerForItem()">扫码</button>
      </div>
    </div>
    <div style="margin-top:12px">
      <label class="small">数量</label>
      <input id="itemQty" type="number" min="0" value="${Number(x?.qty||0)}">
    </div>
    <div style="margin-top:12px">
      <label class="small">库存预警</label>
      <input id="itemAlert" type="number" min="0" value="${Number(x?.alert??10)}">
    </div>
    <div style="margin-top:12px">
      <label class="small">库位</label>
      <input id="itemBin" value="${esc(x?.bin||"")}" placeholder="例如 A-01-02">
    </div>
    <div style="display:flex;gap:8px;margin-top:18px">
      <button class="btn btn-gray" style="flex:1" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" style="flex:1" onclick="saveItem('${id||""}')">
        保存
      </button>
    </div>
  `);
}
async function saveItem(id){
  const name=(document.getElementById("itemName")?.value||"").trim();
  const sku=(document.getElementById("itemSku")?.value||"").trim();
  const qty=Math.max(0,Number(document.getElementById("itemQty")?.value||0));
  const alert=Math.max(0,Number(document.getElementById("itemAlert")?.value||10));
  const bin=(document.getElementById("itemBin")?.value||"").trim();
  if(!sku){
    toast("SKU不能为空","error");
    return;
  }
  const finalName=name||sku;
  loading("正在保存...");
  try{
    if(id){
      /*
        编辑已有库存记录。
        允许把 SKU / 库位改成新的组合。
      */
      const {error}=await sb.rpc("update_inventory_info",{
        p_inventory_id:id,
        p_name:finalName,
        p_sku:sku,
        p_alert:alert,
        p_bin:bin
      });
      if(error)throw error;
      /*
        如果编辑后需要修改数量，不直接 update，
        而是通过库存调整函数进行差额调整。
      */
      const old=inventory.find(x=>x.id===id);
      const oldQty=Number(old?.qty||0);
      const diff=qty-oldQty;
      if(diff!==0){
        const type=diff>0 ? "in" : "out";
        const amount=Math.abs(diff);
        const {error:stockError}=await sb.rpc("adjust_inventory",{
          p_inventory_id:id,
          p_type:type,
          p_qty:amount,
          p_note:"编辑库存数量"
        });
        if(stockError)throw stockError;
      }
      toast("保存成功","success");
    }else{
      /*
        重要：
        新版数据库已经允许同 SKU 不同库位。
        这里使用现有 create_inventory 函数创建一条具体库位记录。
      */
      const {error}=await sb.rpc("create_inventory",{
        p_warehouse_id:currentWarehouse.id,
        p_name:finalName,
        p_sku:sku,
        p_qty:qty,
        p_alert:alert,
        p_bin:bin
      });
      if(error)throw error;

function normalizeHeader(v){
  return String(v||"")
    .trim()
    .toLowerCase()
    .replaceAll(" ","")
    .replaceAll("_","");
}
function findColumn(obj,aliases){
  const keys=Object.keys(obj||{});
  for(const alias of aliases){
    const target=normalizeHeader(alias);
    const found=keys.find(k=>
      normalizeHeader(k)===target
    );
    if(found)return found;
  }
  return null;
}
function parseNumber(v){
  const n=Number(String(v??"").replace(/,/g,"").trim());
  return Number.isFinite(n) ? n : 0;
}
async function handleOutboundFile(file){
  if(!file)return;
  loading("正在读取出库文件...");
  try{
    const name=file.name.toLowerCase();
    let rows=[];
    if(name.endsWith(".xlsx") || name.endsWith(".xls")){
      const buffer=await file.arrayBuffer();
      const wb=XLSX.read(buffer,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      rows=XLSX.utils.sheet_to_json(ws,{defval:""});
    }else{
      const text=await file.text();
      rows=parseTextFile(text);
    }
    if(!rows.length){
      throw new Error("文件中没有找到数据");
    }
    const normalized=[];
    for(const row of rows){
      const skuKey=findColumn(row,[
        "SKU","sku","商品SKU","货号","产品SKU","商品编码","编码"
      ]);
      const qtyKey=findColumn(row,[
        "数量","出库数量","发货数量","qty","quantity"
      ]);
      const orderKey=findColumn(row,[
        "订单号","订单","order","orderid","订单编号"
      ]);
      const sku=String(
        skuKey ? row[skuKey] : ""
      ).trim();
      const qty=parseNumber(
        qtyKey ? row[qtyKey] : ""
      );
      const orderNo=String(
        orderKey ? row[orderKey] : ""
      ).trim();
      if(!sku)continue;
      if(qty<=0)continue;
      normalized.push({
        sku,
        qty,
        orderNo
      });
    }
    if(!normalized.length){
      throw new Error("没有找到有效的 SKU + 数量");
    }
    /*
      相同 SKU 在订单文件出现多次时自动合并。
    */
    const merged=new Map();
    normalized.forEach(x=>{
      const key=x.sku;
      if(!merged.has(key)){
        merged.set(key,{
          sku:key,
          qty:0,
          orderNos:[]
        });
      }
      const r=merged.get(key);
      r.qty+=x.qty;
      if(x.orderNo && !r.orderNos.includes(x.orderNo)){
        r.orderNos.push(x.orderNo);
      }
    });
    /*
      根据当前库存自动分配库位。
      默认按照库位字母顺序分配。
    */
    outboundRows=[...merged.values()].map(x=>{
      const rows=activeInventory()
        .filter(i=>
          String(i.sku||"").trim().toLowerCase()===x.sku.toLowerCase()
        )
        .sort((a,b)=>
          String(a.bin||"").localeCompare(
            String(b.bin||""),
            "zh-CN",
            {numeric:true}
          )
        );
      let remain=x.qty;
      const allocations=[];
      for(const inv of rows){
        if(remain<=0)break;
        const available=Number(inv.qty||0);
        if(available<=0)continue;
        const take=Math.min(available,remain);
        allocations.push({
          inventory_id:inv.id,
          sku:inv.sku,
          name:inv.name||inv.sku,
          bin:inv.bin||"未分配",
          qty:take,
          stock_before:available,
          stock_after:available-take
        });
        remain-=take;
      }
      return {
        sku:x.sku,
        requested:x.qty,
        allocated:x.qty-remain,
        shortage:remain,
        orderNos:x.orderNos,
        allocations,
        status:
          remain<=0
          ? "ok"
          : rows.length
            ? "shortage"
            : "missing"
      };
    });
    closeModal();
    hideLoading();
    render();
    toast(
      outboundRows.every(x=>x.status==="ok")
      ? "文件读取成功，可以确认出库"
      : "文件读取成功，请先检查缺货项目",
      outboundRows.every(x=>x.status==="ok") ? "success" : "info"
    );
  }catch(e){
    hideLoading();
    toast(e.message||"文件读取失败","error");
  }
}
function parseTextFile(text){
  const lines=String(text||"")
    .split(/\r?\n/)
    .map(x=>x.trim())
    .filter(Boolean);
  if(!lines.length)return [];
  /*
    支持：
    SKU,数量
    COKE001,10
    也支持：
    COKE001 10
    COKE001\t10
  */
  const result=[];
  const first=lines[0];
  const hasHeader=
    /sku|货号|编码/i.test(first) &&
    /数量|qty|quantity/i.test(first);
  const start=hasHeader ? 1 : 0;
  for(let i=start;i<lines.length;i++){
    const line=lines[i];
    let parts;
    if(line.includes(",")){
      parts=line.split(",");
    }else if(line.includes("\t")){
      parts=line.split("\t");
    }else{
      parts=line.split(/\s+/);
    }
    const sku=String(parts[0]||"").trim();
    const qty=parseNumber(parts[1]);
    if(sku && qty>0){
      result.push({
        SKU:sku,
        数量:qty
      });
    }
  }
  return result;
}

        "SKU","sku","商品SKU","货号","产品SKU","编码"
      ]);
      const nameKey=findColumn(row,[
        "商品名称","名称","name","产品名称"
      ]);
      const qtyKey=findColumn(row,[
        "数量","库存数量","qty","quantity"
      ]);
      const alertKey=findColumn(row,[
        "库存预警","预警数量","预警","alert","alert_qty"
      ]);
      const binKey=findColumn(row,[
        "库位","货位","仓位","bin","位置"
      ]);
      const sku=String(
        skuKey ? row[skuKey] : ""
      ).trim();
      if(!sku)return;
      const productName=String(
        nameKey ? row[nameKey] : ""
      ).trim() || sku;
      const qty=parseNumber(
        qtyKey ? row[qtyKey] : ""
      );
      const alert=
        alertKey && String(row[alertKey]).trim()!==""
        ? Math.max(0,parseNumber(row[alertKey]))
        : 10;
      const bin=String(
        binKey ? row[binKey] : ""
      ).trim();
      inventoryImportRows.push({
        name:productName,
        sku,
        qty,
        alert,
        bin
      });
    });
    document.getElementById("importPreview").innerHTML=`
      <div class="card" style="background:#f9fafb;padding:12px">
        找到 <b>${inventoryImportRows.length}</b> 条有效记录
      </div>
      <div style="max-height:250px;overflow:auto;margin-top:8px">
        ${inventoryImportRows.slice(0,50).map(x=>`
          <div class="small" style="padding:5px 0;border-bottom:1px solid #eee">
            ${esc(x.sku)} · ${esc(x.bin||"未分配")} · ${x.qty}
          </div>
        `).join("")}
      </div>
    `;
  }catch(e){
    toast(e.message||"读取文件失败","error");
  }
}
function parseInventoryText(text){
  const lines=String(text||"")
    .split(/\r?\n/)
    .map(x=>x.trim())
    .filter(Boolean);
  if(!lines.length)return [];
  const result=[];
  const header=lines[0];
  const hasHeader=
    /sku|货号|编码/i.test(header);
  for(let i=hasHeader?1:0;i<lines.length;i++){
    let parts;
    if(lines[i].includes(",")){
      parts=lines[i].split(",");
    }else if(lines[i].includes("\t")){
      parts=lines[i].split("\t");
    }else{
      parts=lines[i].split(/\s+/);
    }
    if(parts.length<1)continue;
    result.push({
      商品名称:parts[0]||"",
      SKU:parts[1]||parts[0]||"",
      数量:parts[2]||0,
      库存预警:parts[3]||10,
      库位:parts[4]||""
    });
  }
  return result;
}
async function runInventoryImport(){
  if(!inventoryImportRows.length){
    toast("没有可导入的数据","error");
    return;
  }
  if(!confirm(`确定导入 ${inventoryImportRows.length} 条库存吗？`)){
    return;
  }
  closeModal();
  loading("正在批量导入库存...");
  let success=0;
  let fail=0;
  const errors=[];
  for(const row of inventoryImportRows){
    try{
      const {error}=await sb.rpc("create_inventory",{
        p_warehouse_id:currentWarehouse.id,
        p_name:row.name||row.sku,
        p_sku:row.sku,
        p_qty:row.qty,
        p_alert:row.alert,
        p_bin:row.bin
      });
      if(error)throw error;
      success++;
    }catch(e){
      fail++;
      errors.push(`${row.sku} / ${row.bin||"未分配"}：${e.message}`);
    }
  }
  hideLoading();
  await refreshAll();
  if(fail){
    showModal(`
      <div class="section-title">导入完成</div>
      <div style="margin-top:12px">
        <span class="badge badge-green">成功 ${success}</span>
        <span class="badge badge-red">失败 ${fail}</span>
      </div>
      <div style="margin-top:12px;max-height:300px;overflow:auto">
        ${errors.slice(0,30).map(x=>`
          <div class="small" style="padding:5px 0">${esc(x)}</div>
        `).join("")}
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:15px"
        onclick="closeModal()">关闭</button>
    `);
  }else{
    toast(`成功导入 ${success} 条库存`,"success");
  }
  inventoryImportRows=[];
}

function showScanner(target){
  showModal(`

    </button>
  `);
  setTimeout(async()=>{
    try{
      scanner=new Html5Qrcode("reader");
      await scanner.start(
        {facingMode:"environment"},
        {
          fps:10,
          qrbox:{width:250,height:150}
        },
        text=>{
          stopScanner();
          if(target==="search"){
            inventoryKeyword=text;

      );
    }catch(e){
      console.error(e);
      toast("无法打开摄像头，请检查浏览器权限","error");
    }
  },300);
}
async function stopScanner(){
  try{
    if(scanner){
      await scanner.stop();
      scanner.clear();
    }
  }catch(e){}

}

function downloadFile(filename,content,type="text/plain"){
  const blob=new Blob([content],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function exportBackup(){
  const data=activeInventory().map(x=>({
    商品名称:x.name||x.sku,
    SKU:x.sku,
    数量:x.qty,
    库存预警:x.alert,
    库位:x.bin||"",
    是否在架:x.is_active!==false
  }));
  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"库存");
  XLSX.writeFile(
    wb,
    `仓库库存备份_${new Date().toISOString().slice(0,10)}.xlsx`
  );
}
function exportLogs(){
  const data=logs.map(x=>({
    时间:x.created_at,
    类型:x.type,
    数量:x.qty,
