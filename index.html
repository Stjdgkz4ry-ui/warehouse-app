<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2563eb">
<title>智能仓库管理系统</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
.hidden{display:none!important}
.card{background:white;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer}
.btn-blue{background:#2563eb;color:white}
.btn-green{background:#16a34a;color:white}
.btn-red{background:#dc2626;color:white}
.btn-gray{background:#e5e7eb;color:#111827}
.btn-yellow{background:#f59e0b;color:white}
.btn-purple{background:#7c3aed;color:white}
.btn-small{padding:8px 11px;border-radius:9px;font-size:13px}
input,select,textarea{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:11px;
  padding:12px;
  outline:none;
  background:white;
}
input:focus,select:focus,textarea:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.12);
}
.page{max-width:900px;margin:auto;padding-bottom:100px}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:white;
  border-bottom:1px solid #e5e7eb;
}
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:60;
  background:white;
  border-top:1px solid #e5e7eb;
  display:flex;
  justify-content:center;
}
.bottom-nav-inner{
  width:100%;
  max-width:900px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
}
.nav-btn{
  border:0;
  background:white;
  padding:9px 4px 10px;
  font-size:12px;
  color:#6b7280;
}
.nav-btn.active{color:#2563eb;font-weight:700}
.nav-icon{font-size:21px;display:block}
.badge{
  display:inline-block;
  padding:3px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
}
.badge-green{background:#dcfce7;color:#166534}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-yellow{background:#fef3c7;color:#92400e}
.badge-gray{background:#f3f4f6;color:#4b5563}
.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.48);
  z-index:100;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}
.modal{
  width:100%;
  max-width:650px;
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:22px 22px 0 0;
  padding:20px;
}
@media(min-width:700px){
  .modal-bg{align-items:center;padding:20px}
  .modal{border-radius:20px}
}
.toast{
  position:fixed;
  top:70px;
  left:50%;
  transform:translateX(-50%);
  z-index:200;
  max-width:90%;
  padding:12px 18px;
  border-radius:12px;
  color:white;
  box-shadow:0 4px 20px rgba(0,0,0,.2);
  font-size:14px;
}
.toast-ok{background:#16a34a}
.toast-error{background:#dc2626}
.toast-info{background:#2563eb}
.stat-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
@media(min-width:600px){
  .stat-grid{grid-template-columns:repeat(4,1fr)}
}
.stat{
  background:white;
  border-radius:16px;
  padding:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}
.stat-number{font-size:25px;font-weight:800}
.item-row{
  background:white;
  border-radius:16px;
  padding:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
  margin-bottom:10px;
}
.item-actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:12px;
}
@media(min-width:600px){
  .item-actions{grid-template-columns:repeat(5,auto);justify-content:start}
}
.log-row{
  background:white;
  border-radius:14px;
  padding:14px;
  margin-bottom:9px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.spinner{
  width:25px;height:25px;
  border:3px solid #dbeafe;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:auto;
}
@keyframes spin{to{transform:rotate(360deg)}}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}
th{background:#f9fafb;position:sticky;top:0}
.small{font-size:12px;color:#6b7280}
</style>
</head>

<body>

<div id="toast" class="toast hidden"></div>

<!-- ==================== 登录页面 ==================== -->
<div id="authPage" class="min-h-screen flex items-center justify-center p-5">
  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <div class="text-5xl mb-3">📦</div>
      <h1 class="text-3xl font-bold">智能仓库管理</h1>
      <p class="text-gray-500 mt-2">SKU · 库存 · 货位 · 云端共享</p>
    </div>

    <div class="card p-5">
      <div class="flex mb-5 bg-gray-100 rounded-xl p-1">
        <button id="loginTab" class="flex-1 py-2 rounded-lg bg-white font-bold" onclick="showAuthMode('login')">登录</button>
        <button id="registerTab" class="flex-1 py-2 rounded-lg" onclick="showAuthMode('register')">注册</button>
      </div>

      <div id="loginForm">
        <label class="block text-sm font-semibold mb-2">邮箱</label>
        <input id="loginEmail" type="email" placeholder="请输入邮箱">

        <label class="block text-sm font-semibold mb-2 mt-4">密码</label>
        <input id="loginPassword" type="password" placeholder="请输入密码">

        <button class="btn btn-blue w-full mt-5" onclick="login()">登录</button>

        <button class="w-full text-blue-600 text-sm mt-4" onclick="showResetForm()">
          忘记密码？
        </button>
      </div>

      <div id="registerForm" class="hidden">
        <label class="block text-sm font-semibold mb-2">邮箱</label>
        <input id="registerEmail" type="email" placeholder="请输入邮箱">

        <label class="block text-sm font-semibold mb-2 mt-4">密码</label>
        <input id="registerPassword" type="password" placeholder="至少6位密码">

        <button class="btn btn-blue w-full mt-5" onclick="register()">注册</button>

        <p class="small mt-4 text-center">
          注册后可能需要到邮箱点击确认链接。
        </p>
      </div>

      <div id="resetForm" class="hidden">
        <label class="block text-sm font-semibold mb-2">注册邮箱</label>
        <input id="resetEmail" type="email" placeholder="请输入邮箱">

        <button class="btn btn-blue w-full mt-5" onclick="sendReset()">发送重置邮件</button>

        <button class="w-full text-gray-500 text-sm mt-4" onclick="showAuthMode('login')">
          返回登录
        </button>
      </div>
    </div>
  </div>
</div>


<!-- ==================== 主 APP ==================== -->
<div id="appPage" class="hidden">

  <div class="topbar">
    <div class="page px-4 py-3 flex items-center justify-between">
      <div>
        <div class="font-bold text-lg">📦 智能仓库</div>
        <div id="topWarehouseName" class="text-xs text-gray-500"></div>
      </div>

      <button class="btn btn-gray btn-small" onclick="openWarehouseSelector()">
        切换仓库
      </button>
    </div>
  </div>

  <main class="page px-4 pt-4">

    <!-- 首页 -->
    <section id="pageHome">
      <div class="card p-4 mb-4">
        <div class="flex items-center justify-between">
          <div>
            <div class="text-gray-500 text-sm">当前仓库</div>
            <div id="homeWarehouseName" class="text-xl font-bold mt-1">—</div>
          </div>
          <div class="text-4xl">🏭</div>
        </div>
      </div>

      <div class="stat-grid mb-4">
        <div class="stat">
          <div class="small">商品种类</div>
          <div id="statItems" class="stat-number mt-1">0</div>
        </div>
        <div class="stat">
          <div class="small">库存总数</div>
          <div id="statQty" class="stat-number mt-1">0</div>
        </div>
        <div class="stat">
          <div class="small">低库存</div>
          <div id="statLow" class="stat-number mt-1 text-red-600">0</div>
        </div>
        <div class="stat">
          <div class="small">货位数量</div>
          <div id="statBins" class="stat-number mt-1">0</div>
        </div>
      </div>

      <div class="card p-4 mb-4">
        <h2 class="font-bold text-lg mb-3">🔎 快速查找 SKU</h2>
        <div class="flex gap-2">
          <input id="homeSearch" placeholder="输入 SKU / 商品名称 / 货位">
          <button class="btn btn-blue" onclick="searchFromHome()">搜索</button>
        </div>
      </div>

      <div class="card p-4">
        <h2 class="font-bold mb-3">快捷操作</h2>

        <div class="grid grid-cols-2 gap-3">
          <button class="btn btn-blue" onclick="openItem()">➕ 新增商品</button>
          <button class="btn btn-green" onclick="openScanner()">📷 扫码</button>
          <button class="btn btn-purple" onclick="openImport()">📥 批量导入</button>
          <button class="btn btn-gray" onclick="showPage('inventory')">📦 库存列表</button>
        </div>
      </div>
    </section>


    <!-- 库存 -->
    <section id="pageInventory" class="hidden">

      <div class="flex items-center justify-between mb-3">
        <div>
          <h1 class="text-2xl font-bold">库存</h1>
          <div class="small">正常商品</div>
        </div>

        <button class="btn btn-blue btn-small" onclick="openItem()">
          ➕ 新增
        </button>
      </div>

      <div class="card p-3 mb-3">
        <input id="inventorySearch"
               placeholder="搜索 SKU / 商品名称 / 货位"
               oninput="renderInventoryList()">
      </div>

      <div id="inventoryList"></div>

      <button class="btn btn-gray w-full mt-3" onclick="showArchivedInventory()">
        🗂️ 查看已下架商品
      </button>
    </section>


    <!-- 日志 -->
    <section id="pageLogs" class="hidden">

      <div class="flex items-center justify-between mb-3">
        <div>
          <h1 class="text-2xl font-bold">库存流水</h1>
          <div class="small">入库 / 出库记录</div>
        </div>

        <button class="btn btn-gray btn-small" onclick="loadLogs()">刷新</button>
      </div>

      <div class="card p-3 mb-3">
        <input id="logSearch"
               placeholder="搜索 SKU / 商品 / 操作人 / 备注"
               oninput="renderLogs()">
      </div>

      <div id="logsList"></div>
    </section>


    <!-- 设置 -->
    <section id="pageSettings" class="hidden">

      <h1 class="text-2xl font-bold mb-4">设置</h1>

      <div class="card p-4 mb-4">
        <h2 class="font-bold mb-3">🏭 仓库管理</h2>

        <button class="btn btn-blue w-full mb-2" onclick="openWarehouseSelector()">
          切换 / 管理仓库
        </button>

        <button class="btn btn-gray w-full" onclick="createWarehousePrompt()">
          ➕ 创建新仓库
        </button>
      </div>

      <div class="card p-4 mb-4">
        <h2 class="font-bold mb-3">👤 当前账号</h2>
        <div id="currentUserEmail" class="text-gray-600 break-all">—</div>
      </div>

      <div class="card p-4 mb-4">
        <h2 class="font-bold mb-3">💾 数据备份</h2>

        <button class="btn btn-purple w-full mb-2" onclick="exportBackup()">
          导出库存备份
        </button>

        <button class="btn btn-gray w-full" onclick="exportLogs()">
          导出流水
        </button>
      </div>

      <div class="card p-4">
        <button class="btn btn-red w-full" onclick="logout()">
          退出登录
        </button>

        <div class="text-center text-xs text-gray-400 mt-4">
          版本 V2.3 · Cloud Warehouse
        </div>
      </div>
    </section>

  </main>


  <!-- 底部导航 -->
  <div class="bottom-nav">
    <div class="bottom-nav-inner">

      <button id="navHome" class="nav-btn active" onclick="showPage('home')">
        <span class="nav-icon">🏠</span>
        首页
      </button>

      <button id="navInventory" class="nav-btn" onclick="showPage('inventory')">
        <span class="nav-icon">📦</span>
        库存
      </button>

      <button id="navLogs" class="nav-btn" onclick="showPage('logs')">
        <span class="nav-icon">📋</span>
        流水
      </button>

      <button id="navSettings" class="nav-btn" onclick="showPage('settings')">
        <span class="nav-icon">⚙️</span>
        设置
      </button>

    </div>
  </div>

</div>


<!-- ==================== 通用 Modal ==================== -->
<div id="modalBg" class="modal-bg hidden" onclick="closeModalByBg(event)">
  <div id="modalContent" class="modal"></div>
</div>


<script>
/* =========================================================
   基础配置
========================================================= */

const APP_VERSION = 'V2.3-20260910';

const SUPABASE_URL = 'https://veqzicbdvodonkbsbyrt.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_njvb3co4PlkaWTAphXSW4g_IdSynRe-';

const APP = {
  sb: null,
  user: null,
  warehouses: [],
  warehouse: null,
  inventory: [],
  logs: [],
  realtimeInventory: null,
  realtimeLogs: null,
  scanner: null,
  scannerRunning: false
};

APP.sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   小工具
========================================================= */

function $(id){
  return document.getElementById(id);
}

function escapeHtml(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function showToast(message,type='info'){
  const el = $('toast');

  el.className = 'toast';

  if(type === 'ok'){
    el.classList.add('toast-ok');
  }else if(type === 'error'){
    el.classList.add('toast-error');
  }else{
    el.classList.add('toast-info');
  }

  el.textContent = message;
  el.classList.remove('hidden');

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(()=>{
    el.classList.add('hidden');
  },3000);
}

function showError(message){
  showToast(message,'error');
}

function showOk(message){
  showToast(message,'ok');
}

function showInfo(message){
  showToast(message,'info');
}

function loadingHtml(){
  return `
    <div class="py-10 text-center">
      <div class="spinner"></div>
      <div class="small mt-3">正在加载...</div>
    </div>
  `;
}

function formatDate(value){
  if(!value) return '';

  try{
    return new Date(value).toLocaleString('zh-CN',{
      year:'numeric',
      month:'2-digit',
      day:'2-digit',
      hour:'2-digit',
      minute:'2-digit'
    });
  }catch(e){
    return value;
  }
}

function safeNumber(value,defaultValue=0){
  const n = Number(value);

  if(!Number.isFinite(n)){
    return defaultValue;
  }

  return n;
}


/* =========================================================
   Modal
========================================================= */

function openModal(html){
  $('modalContent').innerHTML = html;
  $('modalBg').classList.remove('hidden');
}

function closeModal(){
  $('modalBg').classList.add('hidden');
  $('modalContent').innerHTML = '';
}

function closeModalByBg(event){
  if(event.target.id === 'modalBg'){
    closeModal();
  }
}


/* =========================================================
   Auth
========================================================= */

function showAuthMode(mode){

  $('loginForm').classList.add('hidden');
  $('registerForm').classList.add('hidden');
  $('resetForm').classList.add('hidden');

  $('loginTab').classList.remove('bg-white','font-bold');
  $('registerTab').classList.remove('bg-white','font-bold');

  if(mode === 'register'){
    $('registerForm').classList.remove('hidden');
    $('registerTab').classList.add('bg-white','font-bold');
  }else{
    $('loginForm').classList.remove('hidden');
    $('loginTab').classList.add('bg-white','font-bold');
  }
}

function showResetForm(){
  $('loginForm').classList.add('hidden');
  $('registerForm').classList.add('hidden');
  $('resetForm').classList.remove('hidden');
}

async function register(){

  const email = $('registerEmail').value.trim();
  const password = $('registerPassword').value;

  if(!email){
    return showError('请输入邮箱');
  }

  if(!password || password.length < 6){
    return showError('密码至少需要6位');
  }

  try{

    showInfo('正在注册...');

    const {data,error} = await APP.sb.auth.signUp({
      email,
      password,
      options:{
        emailRedirectTo: window.location.origin + window.location.pathname
      }
    });

    if(error){
      throw error;
    }

    if(data.session){
      showOk('注册成功');
      await bootApp();
    }else{
      showOk('注册成功，请到邮箱确认后再登录');
      showAuthMode('login');
    }

  }catch(error){

    console.error(error);
    showError(error.message || '注册失败');

  }
}

async function login(){

  const email = $('loginEmail').value.trim();
  const password = $('loginPassword').value;

  if(!email || !password){
    return showError('请输入邮箱和密码');
  }

  try{

    showInfo('正在登录...');

    const {data,error} =
      await APP.sb.auth.signInWithPassword({
        email,
        password
      });

    if(error){
      throw error;
    }

    APP.user = data.user;

    await bootApp();

  }catch(error){

    console.error(error);
    showError(error.message || '登录失败');

  }
}

async function sendReset(){

  const email = $('resetEmail').value.trim();

  if(!email){
    return showError('请输入邮箱');
  }

  try{

    const {error} = await APP.sb.auth.resetPasswordForEmail(
      email,
      {
        redirectTo:
          window.location.origin +
          window.location.pathname
      }
    );

    if(error){
      throw error;
    }

    showOk('重置邮件已发送，请检查邮箱');

  }catch(error){

    console.error(error);
    showError(error.message || '发送失败');

  }
}

async function logout(){

  try{
    await APP.sb.auth.signOut();
  }catch(e){
    console.error(e);
  }

  APP.user = null;
  APP.warehouses = [];
  APP.warehouse = null;
  APP.inventory = [];
  APP.logs = [];

  $('appPage').classList.add('hidden');
  $('authPage').classList.remove('hidden');

  showAuthMode('login');
}


/* =========================================================
   App 启动
========================================================= */

async function bootApp(){

  try{

    const {data} = await APP.sb.auth.getUser();

    APP.user = data.user;

    if(!APP.user){
      $('appPage').classList.add('hidden');
      $('authPage').classList.remove('hidden');
      return;
    }

    $('authPage').classList.add('hidden');
    $('appPage').classList.remove('hidden');

    $('currentUserEmail').textContent =
      APP.user.email || '';

    await loadWarehouses();

  }catch(error){

    console.error(error);

    $('appPage').classList.add('hidden');
    $('authPage').classList.remove('hidden');

    showError(error.message || '启动失败');
  }
}


/* =========================================================
   仓库
========================================================= */

async function loadWarehouses(){

  try{

    const {data,error} =
      await APP.sb
        .from('warehouse_members')
        .select(`
          warehouse_id,
          role,
          warehouses (
            id,
            name,
            owner_id,
            join_code,
            created_at
          )
        `)
        .eq('user_id',APP.user.id);

    if(error){
      throw error;
    }

    APP.warehouses = (data || [])
      .filter(x => x.warehouses)
      .map(x => ({
        id:x.warehouses.id,
        name:x.warehouses.name,
        owner_id:x.warehouses.owner_id,
        join_code:x.warehouses.join_code,
        created_at:x.warehouses.created_at,
        role:x.role
      }));

    if(!APP.warehouses.length){

      APP.warehouse = null;

      updateWarehouseHeader();

      openNoWarehouseModal();

      return;
    }

    const savedId =
      localStorage.getItem('warehouse_id');

    let selected =
      APP.warehouses.find(x => x.id === savedId);

    if(!selected){
      selected = APP.warehouses[0];
    }

    await selectWarehouse(selected.id);

  }catch(error){

    console.error(error);
    showError(error.message || '加载仓库失败');

  }
}

async function selectWarehouse(id){

  const w =
    APP.warehouses.find(x => x.id === id);

  if(!w){
    return showError('仓库不存在');
  }

  APP.warehouse = w;

  localStorage.setItem(
    'warehouse_id',
    w.id
  );

  updateWarehouseHeader();

  closeModal();

  await loadInventory();
  await loadLogs();
  setupRealtime();

  renderHome();
  renderInventoryList();
  renderLogs();
}

function updateWarehouseHeader(){

  const name =
    APP.warehouse?.name || '未选择仓库';

  $('topWarehouseName').textContent = name;

async function deleteWarehouse(id){

  const w =
    APP.warehouses.find(x => x.id === id);

  if(!w){
    return;
  }

  if(w.role !== 'owner'){
    return showError('只有仓库所有者可以删除仓库');
  }

  const ok =
    confirm(
      `确定删除仓库「${w.name}」吗？\n\n删除后相关数据可能受到数据库关联限制。`
    );

  if(!ok){
    return;
  }

  try{

    showInfo('正在删除仓库...');

    const {error} =
      await APP.sb
        .from('warehouses')
        .delete()
        .eq('id',id);

    if(error){
      throw error;
    }

    if(APP.warehouse?.id === id){
      APP.warehouse = null;
    }

    await loadWarehouses();

    showOk('仓库已删除');

  }catch(error){

    console.error(error);

    showError(
      '删除失败：' +
      (error.message || '可能存在关联数据')
    );
  }
}

function showPage(page){

  ['Home','Inventory','Logs','Settings']
    .forEach(name=>{
      const el = $('page' + name);

      if(el){
        el.classList.add('hidden');
      }

      const nav = $('nav' + name);

      if(nav){
        nav.classList.remove('active');
      }
    });

  const section =
    $('page' +
      page.charAt(0).toUpperCase() +
      page.slice(1));

  const nav =
    $('nav' +
      page.charAt(0).toUpperCase() +
      page.slice(1));

  if(section){
    section.classList.remove('hidden');
  }

  if(nav){
    nav.classList.add('active');
  }

  if(page === 'home'){
    renderHome();
  }

  if(page === 'inventory'){
    renderInventoryList();
  }

  if(page === 'logs'){
    renderLogs();
  }
}


/* =========================================================
   Inventory
========================================================= */

async function loadInventory(){

  if(!APP.warehouse){
    APP.inventory = [];
    return;
  }

  try{

    const {data,error} =
      await APP.sb
        .from('inventory')
        .select('*')
        .eq(
          'warehouse_id',
          APP.warehouse.id
        )
        .order('created_at',{
          ascending:false
        });

    if(error){
      throw error;
    }

    APP.inventory = data || [];

  }catch(error){

    console.error(error);
    showError(error.message || '加载库存失败');

  }
}

function activeInventory(){

  return APP.inventory.filter(
    x => x.is_active !== false
  );
}

function archivedInventory(){

  return APP.inventory.filter(
    x => x.is_active === false
  );
}

function getItemName(item){

  return (
    item?.name ||
    item?.sku ||
    '未命名商品'
  );
}

function getAlertQty(item){

  const value = item?.alert_qty;

  if(value === null || value === undefined || value === ''){
    return 10;
  }

  const n = Number(value);

  return Number.isFinite(n) ? n : 10;
}

function isLowStock(item){

  const qty =
    safeNumber(item?.qty,0);

  const alert =
    getAlertQty(item);

  return qty <= alert;
}

function renderHome(){

  const items = activeInventory();

  const totalQty =
    items.reduce(
      (sum,x)=>sum + safeNumber(x.qty,0),
      0
    );

  const low =
    items.filter(isLowStock).length;

  const bins =
    new Set(
      items
        .map(x => String(x.bin || '').trim())
        .filter(Boolean)
    ).size;

  $('statItems').textContent =
    items.length;

  $('statQty').textContent =
    totalQty;

  $('statLow').textContent =
    low;

  $('statBins').textContent =
    bins;

  updateWarehouseHeader();
}

function searchFromHome(){

  const value =
    $('homeSearch').value.trim();

  showPage('inventory');

  $('inventorySearch').value =
    value;
  
  renderInventoryList();
}

function renderInventoryList(){

  const container =
    $('inventoryList');

  if(!container){
    return;
  }

  const items =
    activeInventory();

  const search =
    ($('inventorySearch')?.value || '')
      .trim()
      .toLowerCase();

  const filtered =
    items.filter(x => {

      if(!search){
        return true;
      }

      const text = [
        x.sku,
        x.name,
        x.bin
      ]
      .filter(Boolean)
      .join(' ')
      .toLowerCase();

      return text.includes(search);
    });

  if(!filtered.length){

    container.innerHTML = `
      <div class="card p-8 text-center">
        <div class="text-4xl mb-3">📦</div>
        <div class="font-bold">
          ${search ? '没有找到商品' : '还没有商品'}
        </div>

        <div class="small mt-2">

            : '可以点击右上角新增商品'
          }
        </div>
      </div>
    `;

    return;
  }

  container.innerHTML =
    filtered.map(x => {

      const qty =
        safeNumber(x.qty,0);

      const alert =
        getAlertQty(x);

      const low =
        qty <= alert;

      return `
        <div class="item-row">

          <div class="flex items-start justify-between gap-3">

            <div class="min-w-0 flex-1">

              <div class="font-bold text-lg break-all">
                ${escapeHtml(getItemName(x))}
              </div>

              <div class="text-sm text-gray-500 mt-1 break-all">
                SKU：
                <span class="font-semibold text-gray-700">
                  ${escapeHtml(x.sku || '—')}
                </span>
              </div>

              <div class="text-sm text-gray-500 mt-1">
                货位：
                <span class="font-semibold text-gray-700">
                  ${escapeHtml(x.bin || '未设置')}
                </span>
              </div>

            </div>

            <div class="text-right shrink-0">

              <div class="text-2xl font-bold ${
                low ? 'text-red-600' : 'text-green-600'
              }">
                ${qty}
              </div>

              <div class="small">
                库存
              </div>

              ${
                low
                ? `<span class="badge badge-red mt-1">低库存</span>`
                : `<span class="badge badge-green mt-1">正常</span>`
              }

            </div>

          </div>


          <div class="text-xs text-gray-400 mt-3">
            低库存提醒：${alert}
          </div>


          <div class="item-actions">

            <button
              class="btn btn-green btn-small"
              onclick="stockAction('${x.id}','in')">
              📥 入库
            </button>

            <button
              class="btn btn-yellow btn-small"
              onclick="stockAction('${x.id}','out')">
              📤 出库
            </button>

            <button
              class="btn btn-gray btn-small"

              class="btn btn-gray btn-small"

        （可不填）
      </span>
    </label>

    <label class="block text-sm font-semibold mb-2 mt-4">

    </label>

    <input

      低库存提醒
    </label>

    <input
      id="itemAlert"
      type="number"
      min="0"
      value="${alert}">


    <button
      class="btn btn-blue w-full mt-5"
      onclick="saveItem('${id || ''}')">

      ${item ? '保存修改' : '创建商品'}

    </button>


    <button
      class="btn btn-gray w-full mt-2"
      onclick="closeModal()">

      取消

    </button>

  `);

async function saveItem(id){

  const sku =
    $('itemSku').value.trim();

  const name =
    $('itemName').value.trim();

  const bin =
    $('itemBin').value.trim();

  const qty =
    Math.max(
      0,
      safeNumber(
        $('itemQty').value,
        0
      )
    );

  const alert =
    Math.max(
      0,
      safeNumber(
        $('itemAlert').value,
        10
      )
    );

  if(!sku){
    return showError('SKU不能为空');
  }

  const finalName =
    name || sku;

  try{

    showInfo('正在保存...');

    if(id){

      const {error} =
        await APP.sb.rpc(
          'update_inventory_info',
          {
            p_inventory_id:id,
            p_name:finalName,
            p_sku:sku,
            p_alert:alert,
            p_bin:bin
          }
        );

      if(error){
        throw error;
      }

      /*
       * 编辑商品时不直接修改库存数量。
       * 库存数量应该通过入库 / 出库调整，
       * 这样流水才完整。
       */

      closeModal();

      await loadInventory();

      renderInventoryList();
      renderHome();

      showOk('商品修改成功');

    }else{

      const {data,error} =
        await APP.sb.rpc(
          'create_inventory',
          {
            p_warehouse_id:APP.warehouse.id,
            p_name:finalName,
            p_sku:sku,
            p_qty:qty,
            p_alert:alert,
            p_bin:bin
          }
        );

      if(error){
        throw error;
      }

      closeModal();

      await loadInventory();

      renderInventoryList();
      renderHome();

      showOk('商品创建成功');

    }

  }catch(error){

    console.error(error);

    showError(
      error.message ||
      '保存商品失败'
    );

  }
}


/* =========================================================
   入库 / 出库
========================================================= */

function stockAction(id,type){

  const item =
    APP.inventory.find(x => x.id === id);

  if(!item){
    return showError('商品不存在');
  }

  const isIn =
    type === 'in';

  openModal(`

    <h2 class="text-xl font-bold mb-2">
      ${isIn ? '📥 入库' : '📤 出库'}
    </h2>

    <div class="bg-gray-50 rounded-xl p-3 mb-4">

      <div class="font-bold">
        ${escapeHtml(getItemName(item))}
      </div>

      <div class="small mt-1">
        SKU：${escapeHtml(item.sku || '')}
      </div>

      <div class="small mt-1">
        当前库存：
        <strong>
          ${safeNumber(item.qty,0)}
        </strong>
      </div>

    </div>


    <label class="block text-sm font-semibold mb-2">
      数量
    </label>

    <input
      id="stockQty"
      type="number"
      min="1"
      step="1"
      placeholder="请输入数量">


    <label class="block text-sm font-semibold mb-2 mt-4">
      备注
    </label>

    <textarea
      id="stockNote"
      rows="3"
      placeholder="例如：采购到货、客户订单、盘点调整等"></textarea>


    <button
      class="btn ${
        isIn ? 'btn-green' : 'btn-yellow'
      } w-full mt-4"
      onclick="saveStockAction('${id}','${type}')">

      ${isIn ? '确认入库' : '确认出库'}

    </button>


    <button
      class="btn btn-gray w-full mt-2"
      onclick="closeModal()">

      取消

    </button>

  `);
}

async function saveStockAction(id,type){

  const qty =
    Math.floor(
      safeNumber(
        $('stockQty').value,
        0
      )
    );

  const note =
    $('stockNote').value.trim();

  if(qty <= 0){
    return showError('数量必须大于0');
  }

  const item =
    APP.inventory.find(x => x.id === id);

  if(!item){
    return showError('商品不存在');
  }

  const current =
    safeNumber(item.qty,0);

  if(type === 'out' && qty > current){
    return showError(
      `库存不足，目前只有 ${current}`
    );
  }

  try{

    showInfo('正在更新库存...');

    const {data,error} =
      await APP.sb.rpc(
        'adjust_inventory',
        {
          p_inventory_id:id,
          p_type:type,
          p_qty:qty,
          p_note:note
        }
      );

    if(error){
      throw error;
    }

    closeModal();

    await loadInventory();
    await loadLogs();

    renderInventoryList();
    renderLogs();
    renderHome();

    showOk(
      type === 'in'
      ? '入库成功'
      : '出库成功'
    );

  }catch(error){

    console.error(error);

    showError(
      error.message ||
      '库存更新失败'
    );

  }
}

async function archiveInventory(id){

  const item =
    APP.inventory.find(x => x.id === id);

  if(!item){
    return showError('商品不存在');
  }

  const ok =
    confirm(
      `确定把「${getItemName(item)}」下架吗？\n\n下架后不会出现在正常库存列表，但数据不会被删除。`
    );

  if(!ok){
    return;
  }

  try{

    showInfo('正在下架...');

    const {error} =
      await APP.sb.rpc(
        'archive_inventory',
        {
          p_inventory_id:id
        }
      );

    if(error){
      throw error;
    }

    await loadInventory();

    renderInventoryList();
    renderHome();

    showOk('商品已下架');

  }catch(error){

    console.error(error);

    showError(
      error.message ||
      '下架失败'
    );

  }
}

async function restoreInventory(id){

  const item =
    APP.inventory.find(x => x.id === id);

  if(!item){
    return showError('商品不存在');
  }

  try{

    showInfo('正在恢复...');

    const {error} =
      await APP.sb.rpc(
        'restore_inventory',
        {
          p_inventory_id:id
        }
      );

    if(error){
      throw error;
    }

    await loadInventory();

    renderInventoryList();
    renderHome();

    showOk('商品已恢复');

  }catch(error){

    console.error(error);

    showError(
      error.message ||
      '恢复失败'
    );

  }
}

async function loadLogs(){

  if(!APP.warehouse){
    APP.logs = [];
    return;
  }

  try{

    const {data,error} =
      await APP.sb
        .from('stock_logs')
        .select('*')
        .eq(
          'warehouse_id',
          APP.warehouse.id
        )
        .order(
          'created_at',
          {ascending:false}
        );

    if(error){
      throw error;
    }

    APP.logs = data || [];

  }catch(error){

    console.error(error);

    showError(
      error.message ||
      '加载流水失败'
    );
  }
}

function getLogType(log){

  const type =
    String(
      log.type ||
      log.action ||
      ''
    ).toLowerCase();

  if(
    type.includes('in') ||
    type.includes('入')
  ){
    return {
      label:'入库',
      cls:'badge-green'
    };
  }

  if(
    type.includes('out') ||
    type.includes('出')
  ){
    return {
      label:'出库',
      cls:'badge-yellow'
    };
  }

  return {
    label:log.type || log.action || '操作',
    cls:'badge-gray'
  };
}

function findInventoryForLog(log){

  if(log.inventory_id){
    return APP.inventory.find(
      x => x.id === log.inventory_id
    );
  }

  if(log.sku){
    return APP.inventory.find(
      x => x.sku === log.sku
    );
  }

  return null;
}

function renderLogs(){

  const container =
    $('logsList');

  if(!container){
    return;
  }

  const search =
    ($('logSearch')?.value || '')
      .trim()
      .toLowerCase();

  const filtered =
    APP.logs.filter(log => {

      if(!search){
        return true;
      }

      const item =
        findInventoryForLog(log);

      const text = [
        log.sku,
        log.note,
        log.type,
        log.action,
        log.user_email,
        log.operator_email,
        item?.name
      ]
      .filter(Boolean)
      .join(' ')
      .toLowerCase();

      return text.includes(search);
    });

  if(!filtered.length){

    container.innerHTML = `
      <div class="card p-8 text-center">
        <div class="text-4xl mb-3">📋</div>
        <div class="font-bold">
          暂无流水
        </div>
      </div>
    `;

    return;
  }

  container.innerHTML =
    filtered.map(log => {

      const item =
        findInventoryForLog(log);

      const type =
        getLogType(log);

      const qty =
        safeNumber(
          log.qty ??
          log.quantity ??
          log.change_qty,
          0
        );

      const note =
        log.note || '';

      const operator =
        log.user_email ||
        log.operator_email ||
        log.email ||
        '—';

      return `
        <div class="log-row">

          <div class="flex justify-between gap-3">

            <div class="min-w-0">

              <div class="flex items-center gap-2">

                <span class="badge ${type.cls}">
                  ${escapeHtml(type.label)}
                </span>

                <span class="font-bold">
                  ${qty}
                </span>

              </div>

              <div class="font-semibold mt-2 break-all">
                ${escapeHtml(
                  item?.name ||
                  log.name ||
                  log.sku ||
                  '未知商品'
                )}
              </div>

              <div class="small mt-1 break-all">
                SKU：
                ${escapeHtml(
                  item?.sku ||
                  log.sku ||
                  '—'
                )}
              </div>

              ${
                note
                ? `
                  <div class="text-sm text-gray-600 mt-2">
                    📝 ${escapeHtml(note)}
                  </div>
                `
                : ''
              }

              <div class="small mt-2">
                ${formatDate(log.created_at)}
              </div>

              <div class="small mt-1 break-all">
                操作人：${escapeHtml(operator)}
              </div>

            <button

async function startScanner(){

        fps:10,

    APP.scanner &&
    APP.scannerRunning
  ){

    try{
      await APP.scanner.stop();

      console.error(e);
    }
  }

  APP.scannerRunning = false;

  APP.scanner = null;
}

    </button>

    </button>

    <div

  `);

function normalizeHeader(value){

  return String(value ?? '')
    .trim()
    .toLowerCase()
    .replace(/\s+/g,'');
}

function findHeader(headers,names){

  for(const name of names){

    const target =
      normalizeHeader(name);

    const index =
      headers.findIndex(
        h => normalizeHeader(h) === target
      );

    if(index >= 0){
      return index;
    }
  }

  return -1;
}

function importNumber(value){

  if(
    value === null ||
    value === undefined ||
    String(value).trim() === ''
  ){
    return 0;
  }

  const n =
    Number(
      String(value)
        .replace(/,/g,'')
        .trim()
    );

  return Number.isFinite(n)
    ? n
    : 0;
}

async function runImport(type){

  if(type !== 'items'){
    return;
  }

  const file =
    $('importFile')?.files?.[0];

  if(!file){
    return showError('请先选择文件');
  }

  if(!APP.warehouse){
    return showError('请先选择仓库');
  }

  try{

    showInfo('正在读取文件...');

    const buffer =
      await file.arrayBuffer();

    let workbook;

    if(
      file.name.toLowerCase().endsWith('.txt') ||
      file.name.toLowerCase().endsWith('.csv')
    ){

      const text =
        new TextDecoder('utf-8')
          .decode(buffer);

      workbook =
        XLSX.read(text,{
          type:'string'
        });

    }else{

      workbook =
        XLSX.read(buffer,{
          type:'array'
        });
    }

    const sheetName =
      workbook.SheetNames[0];

    const sheet =
      workbook.Sheets[sheetName];

    const rows =
      XLSX.utils.sheet_to_json(
        sheet,
        {
          header:1,
          defval:''
        }
      );

    if(!rows.length){
      throw new Error('文件没有数据');
    }

    const headers =
      rows[0];

    const skuIndex =
      findHeader(
        headers,
        [
          'SKU',
          'sku',
          '货号',
          '商品SKU',
          '商品编码',
          '编码'
        ]
      );

    if(skuIndex < 0){
      throw new Error(
        '没有找到 SKU 表头。请确保第一行有“SKU”。'
      );
    }

    const nameIndex =
      findHeader(
        headers,
        [
          '名称',
          '商品名称',
          'name',
          '商品名'
        ]
      );

    const qtyIndex =
      findHeader(
        headers,
        [
          '数量',
          '库存',
          'qty',
          'quantity'
        ]
      );

    const alertIndex =
      findHeader(
        headers,
        [
          '低库存',
          '提醒数量',
          '预警数量',
          'alert',
          'alert_qty'
        ]
      );

    const binIndex =
      findHeader(
        headers,
        [
          '货位',
          '货架',
          '库位',
          'bin',
          'location'
        ]
      );

    let success = 0;
    let skipped = 0;

    const errors = [];

    for(let i=1;i<rows.length;i++){

      const row =
        rows[i];

      const line =
        i + 1;

      const sku =
        String(
          row[skuIndex] ?? ''
        ).trim();

      if(!sku){

        skipped++;

        errors.push(
          `第${line}行：SKU为空`
        );

        continue;
      }

      let name =
        nameIndex >= 0
        ? String(
            row[nameIndex] ?? ''
          ).trim()
        : '';

      if(!name){
        name = sku;
      }

      const qty =
        qtyIndex >= 0
        ? importNumber(row[qtyIndex])
        : 0;

      const alert =
        alertIndex >= 0 &&
        String(row[alertIndex] ?? '').trim() !== ''
        ? importNumber(row[alertIndex])
        : 10;

      const bin =
        binIndex >= 0
        ? String(
            row[binIndex] ?? ''
          ).trim()
        : '';

      try{

        const {error} =
          await APP.sb.rpc(
            'create_inventory',
            {
              p_warehouse_id:APP.warehouse.id,
              p_name:name,
              p_sku:sku,
              p_qty:Math.max(0,qty),
              p_alert:Math.max(0,alert),
              p_bin:bin
            }
          );

        if(error){
          throw error;
        }

        success++;

      }catch(error){

        const message =
          String(
            error?.message ||
            '导入失败'
          );

        /*
         * 如果 SKU 已存在，记录为失败。
         */
        errors.push(
          `第${line}行：${message}`
        );
      }
    }

    await loadInventory();

    renderInventoryList();
    renderHome();

    let html = `
      <div class="bg-green-50 rounded-xl p-3">
        <div class="font-bold text-green-700">
          导入完成
        </div>

        <div class="mt-2">
          成功：${success}
        </div>

        <div>
          跳过：${skipped}
        </div>

        <div>
          错误：${errors.length}
        </div>
      </div>
    `;

    if(errors.length){

      html += `
        <div class="bg-red-50 rounded-xl p-3 mt-3">

          <div class="font-bold text-red-700 mb-2">
            部分记录没有导入
          </div>

          <div class="max-h-52 overflow-auto text-xs">
            ${errors
              .slice(0,100)
              .map(x =>
                `<div class="mb-1">
                  ${escapeHtml(x)}
                </div>`
              )
              .join('')
            }
          </div>

        </div>
      `;
    }

    $('importResult').innerHTML =
      html;

    showOk(
      `导入完成，成功 ${success} 条`
    );

  }catch(error){

    console.error(error);

    $('importResult').innerHTML = `
      <div class="bg-red-50 rounded-xl p-3 text-red-700">
        ${escapeHtml(
          error.message ||
          '导入失败'
        )}
      </div>
    `;

    showError(
      error.message ||
      '导入失败'
    );
  }
}

function downloadBlob(blob,filename){

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement('a');

  a.href = url;
  a.download = filename;

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(()=>{
    URL.revokeObjectURL(url);
  },1000);
}

function exportBackup(){

  if(!APP.inventory.length){
    return showError('没有库存数据');
  }

  const data =
    activeInventory().map(x => ({
      SKU:x.sku || '',
      商品名称:getItemName(x),
      库存:safeNumber(x.qty,0),
      低库存提醒:getAlertQty(x),
      货位:x.bin || '',
      状态:x.is_active === false
        ? '下架'
        : '正常'
    }));

  const ws =
    XLSX.utils.json_to_sheet(data);

  const wb =
    XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    wb,
    ws,
    '库存'
  );

  const output =
    XLSX.write(
      wb,
      {
        bookType:'xlsx',
        type:'array'
      }
    );

  downloadBlob(
    new Blob(
      [output],
      {
        type:
        'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
      }
    ),
    `仓库库存备份_${new Date().toISOString().slice(0,10)}.xlsx`
  );

  showOk('库存备份已生成');
}

   Realtime
========================================================= */

function setupRealtime(){

  if(!APP.warehouse){
    return;
  }

  if(APP.realtimeInventory){

    try{
      APP.sb.removeChannel(
        APP.realtimeInventory
      );
    }catch(e){}

    APP.realtimeInventory = null;
  }

  if(APP.realtimeLogs){

    try{
      APP.sb.removeChannel(
        APP.realtimeLogs
      );
    }catch(e){}

    APP.realtimeLogs = null;
  }


  APP.realtimeInventory =
    APP.sb
      .channel(
        'inventory-' +
        APP.warehouse.id
      )
      .on(
        'postgres_changes',
        {
          event:'*',
          schema:'public',
          table:'inventory',
          filter:
            `warehouse_id=eq.${APP.warehouse.id}`
        },
        async () => {

          await loadInventory();

          renderHome();
          renderInventoryList();

        }
      )
      .subscribe();


  APP.realtimeLogs =
    APP.sb
      .channel(
        'logs-' +
        APP.warehouse.id
      )
      .on(
        'postgres_changes',
        {
          event:'*',
          schema:'public',
          table:'stock_logs',
          filter:
            `warehouse_id=eq.${APP.warehouse.id}`
        },
        async () => {

          await loadLogs();

          renderLogs();

        }
      )
      .subscribe();
}


/* =========================================================
   Auth 状态
========================================================= */

APP.sb.auth.onAuthStateChange(
  async (event,session)=>{

    console.log(
      'Auth event:',
      event
    );

    if(session?.user){

      APP.user =
        session.user;

      /*
       * RECOVERY 时也允许进入 App。
       * 这样邮箱确认 / 密码恢复链接
       * 不会因为前端判断而卡死。
       */

      if(
        event === 'SIGNED_IN' ||
        event === 'INITIAL_SESSION' ||
        event === 'PASSWORD_RECOVERY'
      ){

        setTimeout(
          ()=>{
            bootApp();
          },
          100
        );
      }

    }else{

      APP.user = null;

      if(event === 'SIGNED_OUT'){

        $('appPage').classList.add('hidden');
        $('authPage').classList.remove('hidden');

      }
    }
  }
);


/* =========================================================
   页面初始化
========================================================= */

(async function init(){

  console.log(
    'Smart Warehouse',
    APP_VERSION
  );

  try{

    const {data} =
      await APP.sb.auth.getSession();

    if(data.session){

      APP.user =
        data.session.user;

      await bootApp();

    }else{

      $('authPage').classList.remove('hidden');
      $('appPage').classList.add('hidden');

    }

  }catch(error){

    console.error(error);

    $('authPage').classList.remove('hidden');
    $('appPage').classList.add('hidden');

  }

})();
</script>
