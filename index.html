/* =========================================================
   智能仓库管理系统 V2.1
   ========================================================= */

/* 你的 Supabase 云端配置 */
const SUPABASE_URL =
  'https://veqzicbdvodonkbsbyrt.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_njvb3co4PlkaWTAphXSW4g_IdSynRe';


const APP = {
  sb:null,
  user:null,
  warehouse:null,
  warehouses:[],
  inventory:[],
  logs:[],
  role:'member',
  page:'home',
  authMode:'login',
  stockType:'in',

  realtime:null,

  scanner:null,
  scannerRunning:false,
  scannerMode:null,

  recovery:false,
  booting:false
};


const $ = id => document.getElementById(id);


const esc = s =>
  String(s ?? '').replace(/[&<>'"]/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    "'":'&#39;',
    '"':'&quot;'
  }[c]));


function showError(msg){
  alert(msg || '操作失败');
}


function showRealError(prefix,e){

  console.error(prefix,e);

  let m =
    e?.message ||
    e?.error_description ||
    e?.details ||
    '未知错误';

  if(e?.hint){
    m += '\n提示：'+e.hint;
  }

  if(e?.code){
    m += '\n代码：'+e.code;
  }

  showError(prefix+'\n'+m);
}


/* =========================================================
   Supabase
   ========================================================= */

function getConfig(){

  return {
    url:SUPABASE_URL.trim().replace(/\/$/,''),
    key:SUPABASE_KEY.trim()
  };

}


/*
  邮件确认、密码重置都返回当前 GitHub Pages 页面。
*/
function getRedirectUrl(){

  const u = new URL(window.location.href);

  u.search='';
  u.hash='';

  return u.toString();
}


function isRecoveryLink(){

  const raw=(location.hash||'').replace(/^#/,'');

  if(!raw)return false;

  try{

    const p=new URLSearchParams(raw);

    return p.get('type')==='recovery';

  }catch(e){

    return false;

  }
}


function cleanRecoveryUrl(){

  try{

    const u=new URL(window.location.href);

    u.hash='';
    u.search='';

    history.replaceState(
      {},
      document.title,
      u.toString()
    );

  }catch(e){}

}


function rpcValue(data){

  if(data==null)return null;

  if(typeof data==='string')
    return data;

  if(Array.isArray(data))
    return rpcValue(data[0]);

  if(typeof data==='object'){

    return (
      data.id ||
      data.warehouse_id ||
      data.warehouseId ||
      data.result ||
      data.value ||
      null
    );

  }

  return null;
}


function initSupabase(){

  const c=getConfig();

  if(!c.url || !c.key){

    renderAuth();

    return false;
  }

  try{

    APP.sb =
      window.supabase.createClient(
        c.url,
        c.key,
        {
          auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
          }
        }
      );

    return true;

  }catch(e){

    showRealError(
      '云端初始化失败',
      e
    );

    return false;
  }
}


/* =========================================================
   登录
   ========================================================= */

function renderAuth(){

  $('app').innerHTML=`

  <div class="min-h-screen flex items-center justify-center p-5">

    <div class="card w-full max-w-md p-6">

      <div class="text-center mb-6">

        <div class="text-4xl mb-2">
          📦
        </div>

        <h1 class="text-2xl font-bold">
          智能仓库管理系统
        </h1>

        <p class="text-gray-500 mt-2">
          云端共享 · 手机扫码 · 多人协作
        </p>

      </div>


      <div
        id="authMsg"
        class="hidden mb-4 rounded-xl p-3 text-sm">
      </div>


      <div class="space-y-3">

        <input
          id="authEmail"
          type="email"
          autocomplete="email"
          placeholder="邮箱"
          class="w-full border rounded-xl px-4 py-3">


        <input
          id="authPwd"
          type="password"
          autocomplete="${APP.authMode==='login'?'current-password':'new-password'}"
          placeholder="密码（至少6位）"
          class="w-full border rounded-xl px-4 py-3">


        <button
          onclick="authSubmit()"
          class="w-full bg-blue-600 text-white rounded-xl py-3 font-bold">

          ${APP.authMode==='login'?'登录':'注册'}

        </button>


        ${
          APP.authMode==='login'
          ?
          `
          <button
            onclick="showResetRequest()"
            class="w-full text-blue-600 py-2">

            忘记密码？

          </button>
          `
          :
          ''
        }


        <button
          onclick="toggleAuth()"
          class="w-full border rounded-xl py-3">

          ${
            APP.authMode==='login'
            ?
            '没有账号？注册'
            :
            '已有账号？登录'
          }

        </button>


        <div class="text-center text-xs text-gray-400 pt-2">

          云端已连接

        </div>

      </div>

    </div>

  </div>

  `;
}


function toggleAuth(){

  APP.authMode =
    APP.authMode==='login'
    ?
    'register'
    :
    'login';

  renderAuth();
}


function authMsg(text,ok=false){

  const e=$('authMsg');

  if(!e)return;

  e.textContent=text;

  e.className =
    'mb-4 rounded-xl p-3 text-sm '+
    (
      ok
      ?
      'bg-green-50 text-green-700'
      :
      'bg-red-50 text-red-700'
    );
}


async function authSubmit(){

  if(!APP.sb){

    showError('云端尚未连接');

    return;
  }


  const email=$('authEmail')?.value.trim();

  const pwd=$('authPwd')?.value;


  if(!email)
    return authMsg('请输入邮箱');


  if(!pwd)
    return authMsg('请输入密码');


  if(pwd.length<6)
    return authMsg('密码至少6位');


  try{

    /* 注册 */

    if(APP.authMode==='register'){

      const r =
        await APP.sb.auth.signUp({

          email,

          password:pwd,

          options:{
            emailRedirectTo:getRedirectUrl()
          }

        });


      if(r.error)
        throw r.error;


      if(r.data?.session){

        authMsg(
          '注册成功，正在进入系统……',
          true
        );

        APP.user=r.data.user;

        await bootUser();

      }else{

        authMsg(
          '注册成功！如果系统要求邮箱确认，请打开邮箱确认。确认后返回这里，用刚才设置的密码登录。',
          true
        );

      }


      return;
    }


    /* 登录 */

    const r =
      await APP.sb.auth.signInWithPassword({

        email,

        password:pwd

      });


    if(r.error){

      if(r.error.code==='invalid_credentials'){

        throw new Error(
          '邮箱或密码不正确。\n\n' +
          '你的账号已经存在并且邮箱已经确认。\n' +
          '如果忘记密码，请点击“忘记密码？”重新设置密码。'
        );

      }

      throw r.error;

    }


    APP.user=r.data.user;

    await bootUser();


  }catch(e){

    showRealError(
      APP.authMode==='register'
      ?
      '注册失败'
      :
      '登录失败',
      e
    );

  }
}

    <div class="card w-full max-w-md p-6">

      <div class="text-center mb-5">

        <div class="text-4xl">
          🔐
        </div>

        <h1 class="text-2xl font-bold mt-2">
          重置密码
        </h1>

        <p class="text-gray-500 mt-2">
          输入注册邮箱，我们会发送密码重置邮件。
        </p>

      </div>


      <div
        id="resetMsg"
        class="hidden mb-4 rounded-xl p-3 text-sm">
      </div>


      <input
        id="resetEmail"
        type="email"
        autocomplete="email"
        placeholder="注册邮箱"
        class="w-full border rounded-xl px-4 py-3">


      <button
        onclick="sendResetEmail()"
        class="w-full bg-blue-600 text-white rounded-xl py-3 font-bold mt-3">

        发送重置邮件

      </button>


      <button
        onclick="renderAuth()"
        class="w-full border rounded-xl py-3 mt-3">

      </button>

    </div>

  </div>

  `;
}


function resetMsg(text,ok=false){

  const e=$('resetMsg');

  if(!e)return;

  e.textContent=text;

  e.className =
    'mb-4 rounded-xl p-3 text-sm '+
    (
      ok
      ?
      'bg-green-50 text-green-700'
      :
      'bg-red-50 text-red-700'
    );
}


async function sendResetEmail(){

  const email=$('resetEmail')?.value.trim();

  if(!email)
    return resetMsg('请输入邮箱');


  try{

    const r =
      await APP.sb.auth.resetPasswordForEmail(
        email,
        {
          redirectTo:getRedirectUrl()
        }
      );


    if(r.error)
      throw r.error;


    resetMsg(
      '重置邮件已发送。请打开邮箱并点击邮件链接。打开后会显示“设置新密码”。',
      true
    );


  }catch(e){

    showRealError(
      '发送重置邮件失败',
      e
    );

  }
}


/* =========================================================
   设置新密码
   ========================================================= */

function renderRecovery(){

  $('app').innerHTML=`

  <div class="min-h-screen flex items-center justify-center p-5">

    <div class="card w-full max-w-md p-6">

      <div class="text-center mb-5">

        <div class="text-4xl">
          🔑
        </div>

        <h1 class="text-2xl font-bold mt-2">
          设置新密码
        </h1>

        <p class="text-gray-500 mt-2">
          请设置一个新的登录密码。
        </p>

      </div>


      <div
        id="recoveryMsg"
        class="hidden mb-4 rounded-xl p-3 text-sm">
      </div>


      <div class="space-y-3">

        <input
          id="newPwd"
          type="password"
          autocomplete="new-password"
          placeholder="新密码（至少6位）"
          class="w-full border rounded-xl px-4 py-3">


        <input
          id="newPwd2"
          type="password"
          autocomplete="new-password"
          placeholder="再次输入新密码"
          class="w-full border rounded-xl px-4 py-3">


        <button
          onclick="updateRecoveryPassword()"
          class="w-full bg-blue-600 text-white rounded-xl py-3 font-bold">

          保存新密码

        </button>

      </div>

    </div>

  </div>

  `;
}


function recoveryMsg(text,ok=false){

  const e=$('recoveryMsg');

  if(!e)return;

  e.textContent=text;

  e.className =
    'mb-4 rounded-xl p-3 text-sm '+
    (
      ok
      ?
      'bg-green-50 text-green-700'
      :
      'bg-red-50 text-red-700'
    );
}


async function updateRecoveryPassword(){

  const p1=$('newPwd')?.value || '';

  const p2=$('newPwd2')?.value || '';


  if(p1.length<6)
    return recoveryMsg('新密码至少6位');


  if(p1!==p2)
    return recoveryMsg('两次输入的密码不一致');


  try{

    const r =
      await APP.sb.auth.updateUser({
        password:p1
      });


    if(r.error)
      throw r.error;


    APP.recovery=false;

    APP.user=r.data?.user || APP.user;

    cleanRecoveryUrl();


    recoveryMsg(
      '密码修改成功！正在进入仓库……',
      true
    );


    setTimeout(async()=>{

      try{
        await bootUser();
      }catch(e){
        showRealError(
          '进入仓库失败',
          e
        );
      }

    },800);


  }catch(e){

    showRealError(
      '修改密码失败',
      e
    );

  }
}

async function changePassword(){

  const p1=$('changePwd1')?.value || '';

  const p2=$('changePwd2')?.value || '';


  if(p1.length<6)
    return showError('新密码至少6位');


  if(p1!==p2)
    return showError('两次密码不一致');


  try{

    const r =
      await APP.sb.auth.updateUser({
        password:p1
      });


    if(r.error)
      throw r.error;


    closeModal();

    alert(
      '密码修改成功。\n以后请使用新密码登录。'
    );


  }catch(e){

    showRealError(
      '修改密码失败',
      e
    );

  }
}


/* =========================================================
   系统启动
   ========================================================= */

async function boot(){

  if(APP.booting)
    return;

  APP.booting=true;


  if(!initSupabase()){

    APP.booting=false;

    return;
  }


  if(isRecoveryLink()){

    APP.recovery=true;

  }


  APP.sb.auth.onAuthStateChange(
    (event,session)=>{

      console.log(
        'Supabase Auth:',
        event
      );


      /* 密码恢复 */

      if(event==='PASSWORD_RECOVERY'){

        APP.recovery=true;

        APP.user =
          session?.user ||
          APP.user;


        setTimeout(()=>{

          if(APP.user)
            renderRecovery();

        },0);


        return;
      }


      /* 有登录 session */

      if(session?.user){

        APP.user=session.user;


        if(APP.recovery){

          setTimeout(
            ()=>renderRecovery(),
            0
          );

        }else{

          setTimeout(
            ()=>{
              bootUser().catch(
                e=>showRealError(
                  '读取账号数据失败',
                  e
                )
              );
            },
            0
          );

        }


      }else if(event==='SIGNED_OUT'){

        APP.user=null;

        APP.warehouse=null;

        cleanupRealtime();

        APP.recovery=false;

        renderAuth();

      }

    }
  );


  try{

    const {
      data:{session},
      error
    } =
      await APP.sb.auth.getSession();


    if(error)
      throw error;


    /* 密码恢复页面 */

    if(APP.recovery || isRecoveryLink()){

      APP.recovery=true;


      if(session?.user){

        APP.user=session.user;

        renderRecovery();

      }else{

        renderAuth();

        authMsg(
          '密码重置链接已失效，请重新发送一封重置邮件。'
        );

      }


      APP.booting=false;

      return;
    }


    /* 正常登录 */

    if(session?.user){

      APP.user=session.user;

      await bootUser();

    }else{

      renderAuth();

    }


  }catch(e){

    showRealError(
      '系统启动失败',
      e
    );

    renderAuth();

  }


  APP.booting=false;
}


/* =========================================================
   用户
   ========================================================= */

async function bootUser(){

  if(!APP.user || !APP.sb)
    return;


  await loadWarehouses();


  if(!APP.warehouse && APP.warehouses.length){

    APP.warehouse=APP.warehouses[0];

    APP.role=
      APP.warehouse.role ||
      'member';


    await Promise.all([
      loadInventory(),
      loadLogs()
    ]);


    setupRealtime();
  }


  renderApp();
}


/* =========================================================
   仓库
   ========================================================= */

async function loadWarehouses(){

  const {
    data:m,
    error:me
  } =
    await APP.sb
      .from('warehouse_members')
      .select('warehouse_id,role')
      .eq('user_id',APP.user.id);


  if(me)
    throw me;


  const ids =
    (m||[])
      .map(x=>x.warehouse_id)
      .filter(Boolean);


  if(!ids.length){

    APP.warehouses=[];

    APP.warehouse=null;

    return;
  }


  const {
    data:w,
    error:we
  } =
    await APP.sb
      .from('warehouses')
      .select('*')
      .in('id',ids);


  if(we)
    throw we;


  APP.warehouses =
    (w||[]).map(x=>({

      ...x,

      role:
        (m||[])
          .find(
            mm=>mm.warehouse_id===x.id
          )?.role ||
        'member'

    }));


  if(APP.warehouse){

    const nw =
      APP.warehouses.find(
        x=>x.id===APP.warehouse.id
      );


    APP.warehouse=nw||null;


    if(!nw)
      cleanupRealtime();

  }
}


async function selectWarehouse(id){

  const w =
    APP.warehouses.find(
      x=>x.id===id
    );


  if(!w)
    return;


  cleanupRealtime();


  APP.warehouse=w;

  APP.role=w.role||'member';

  APP.page='home';


  try{

    await Promise.all([
      loadInventory(),
      loadLogs()
    ]);


    setupRealtime();

    renderApp();


  }catch(e){

    showRealError(
      '读取仓库数据失败',
      e
    );

  }
}


async function createWarehouse(){

  const name=$('whName')?.value.trim();


  if(!name)
    return showError('请输入仓库名称');


  try{

    const r =
      await APP.sb.rpc(
        'create_warehouse',
        {
          p_name:name
        }
      );


    if(r.error)
      throw r.error;


    const id=rpcValue(r.data);


    await loadWarehouses();


    let w =
      id &&
      APP.warehouses.find(
        x=>x.id===id
      );


    if(!w){

      w =
        APP.warehouses.find(
          x=>x.name===name
        );

    }


    closeModal();


    if(w){

      await selectWarehouse(w.id);

    }else{

      renderApp();

      alert(
        '仓库创建成功，请重新选择仓库。'
      );

    }

  }catch(e){

    showRealError(
      '创建仓库失败',
      e
    );

  }
}


async function joinWarehouse(){

  const code=$('joinCode')?.value.trim();


  if(!/^\d{6}$/.test(code))
    return showError(
      '请输入6位数字邀请码'
    );


  try{

    const r =
      await APP.sb.rpc(
        'join_warehouse',
        {
          p_join_code:code
        }
      );


    if(r.error)
      throw r.error;


    const id=rpcValue(r.data);


    await loadWarehouses();


    const w =
      id &&
      APP.warehouses.find(
        x=>x.id===id
      );


    closeModal();


    if(w){

      await selectWarehouse(w.id);

    }else{

      renderApp();

      alert(
        '加入成功，请重新选择仓库。'
      );

    }

  }catch(e){

    showRealError(
      '加入仓库失败',
      e
    );

  }
}


/* =========================================================
   库存
   ========================================================= */

async function loadInventory(){

  if(!APP.warehouse)
    return;


  const {
    data,
    error
  } =
    await APP.sb
      .from('inventory')
      .select('*')
      .eq(
        'warehouse_id',
        APP.warehouse.id
      )
      .order(
        'created_at',
        {
          ascending:false
        }
      );


  if(error)
    throw error;


  APP.inventory=data||[];
}


async function loadLogs(){

  if(!APP.warehouse)
    return;


  const {
    data,
    error
  } =
    await APP.sb
      .from('stock_logs')
      .select('*')
      .eq(
        'warehouse_id',
        APP.warehouse.id
      )
      .order(
        'created_at',
        {
          ascending:false
        }
      )
      .limit(200);


  if(error)
    throw error;


  APP.logs=data||[];
}


/* =========================================================
   实时同步
   ========================================================= */

function setupRealtime(){

  cleanupRealtime();


  if(!APP.warehouse)
    return;


  const wid=APP.warehouse.id;


  APP.realtime =
    APP.sb
      .channel(
        'warehouse-'+
        wid+
        '-'+
        Date.now()
      )

      .on(
        'postgres_changes',
        {
          event:'*',
          schema:'public',
          table:'inventory',
          filter:
            'warehouse_id=eq.'+
            wid
        },
        ()=>{

          loadInventory()
            .then(
              ()=>renderApp()
            )
            .catch(
              e=>console.error(
                '库存同步失败',
                e
              )
            );

        }
      )

      .on(
        'postgres_changes',
        {
          event:'*',
          schema:'public',
          table:'stock_logs',
          filter:
            'warehouse_id=eq.'+
            wid
        },
        ()=>{

          loadLogs()
            .then(
              ()=>renderApp()
            )
            .catch(
              e=>console.error(
                '日志同步失败',
                e
              )
            );

        }
      )

      .subscribe();

}

function intVal(v){

  const n=Number(v);

  return Number.isInteger(n)&&n>=0
    ?
    n
    :
    null;

}


async function saveItem(id){

  const name=$('itemName')?.value.trim();

  const sku=$('itemSku')?.value.trim();

  const alertQty=
    intVal(
      $('itemAlert')?.value
    );

  const bin=$('itemBin')?.value.trim();


  if(!name||!sku)
    return showError(
      '商品名称和SKU不能为空'
    );


  if(alertQty===null)
    return showError(
      '低库存数量必须是非负整数'
    );


  if(!id){

    const qty=
      intVal(
        $('itemQty')?.value
      );


    if(qty===null)
      return showError(
        '初始库存必须是非负整数'
      );


    if(
      APP.inventory.some(
        x=>
          String(x.sku)
            .trim()
            .toLowerCase()
          ===
          sku.toLowerCase()
      )
    ){

      return showError(
        '当前仓库已经存在这个SKU'
      );

    }


    try{

      const r=
        await APP.sb.rpc(
          'create_inventory',
          {
            p_warehouse_id:
              APP.warehouse.id,

            p_name:name,

            p_sku:sku,

            p_qty:qty,

            p_alert:alertQty,

            p_bin:bin
          }
        );


      if(r.error)
        throw r.error;


      await loadInventory();

      closeModal();

      renderApp();


    }catch(e){

      showRealError(
        '新增商品失败',
        e
      );

    }


  }else{


    const dup=
      APP.inventory.find(
        x=>
          x.id!==id &&
          String(x.sku)
            .trim()
            .toLowerCase()
          ===
          sku.toLowerCase()
      );


    if(dup)
      return showError(
        '当前仓库已经存在这个SKU'
      );


    try{

      const r=
        await APP.sb.rpc(
          'update_inventory_info',
          {
            p_inventory_id:id,
            p_name:name,
            p_sku:sku,
            p_alert:alertQty,
            p_bin:bin
          }
        );


      if(r.error)
        throw r.error;


      await loadInventory();

      closeModal();

      renderApp();


    }catch(e){

      showRealError(
        '保存商品失败',
        e
      );

    }

  }
}

        type="number"
        min="1"
        step="1"
        value="1"
        placeholder="数量"
        class="w-full border rounded-xl px-4 py-3">


      <input
        id="stockNote"
        placeholder="备注（可选）"
        class="w-full border rounded-xl px-4 py-3">


      <button
        onclick="saveStock()"
        class="w-full ${
          type==='in'
          ?
          'bg-green-600'
          :
          'bg-orange-600'
        } text-white rounded-xl py-3 font-bold">

        确认${type==='in'?'入库':'出库'}

      </button>


      <button
        onclick="openImport('stock')"
        class="w-full border rounded-xl py-3">

        📁 批量${type==='in'?'入库':'出库'}

      </button>

    </div>

    `
  );
}


async function saveStock(){

  const sku=
    $('stockSku')?.value.trim();

  const qty=
    intVal(
      $('stockQty')?.value
    );

  const note=
    $('stockNote')?.value.trim() ||
    '';


  if(!sku)
    return showError(
      '请输入或扫描SKU'
    );


  if(!qty||qty<1)
    return showError(
      '数量必须是大于0的整数'
    );


  const item=
    APP.inventory.find(
      x=>
        String(x.sku)
          .trim()
          .toLowerCase()
        ===
        sku.toLowerCase()
    );


  if(!item){

    if(APP.stockType==='in'){

      closeModal();

      openItem(null,sku);

      alert(
        '这个条码还没有商品资料。\n' +
        '已经把扫描到的SKU填入新增商品。'
      );

    }else{

      showError(
        '出库失败：找不到这个SKU'
      );

    }

    return;
  }


  if(
    APP.stockType==='out' &&
    Number(item.qty)<qty
  ){

    return showError(
      `库存不足。当前库存：${item.qty}`
    );

  }


  try{

    const r=
      await APP.sb.rpc(
        'adjust_inventory',
        {
          p_inventory_id:item.id,
          p_type:APP.stockType,
          p_qty:qty,
          p_note:note
        }
      );


    if(r.error)
      throw r.error;


    await Promise.all([
      loadInventory(),
      loadLogs()
    ]);


    closeModal();

    renderApp();


  }catch(e){

    showRealError(
      '库存调整失败',
      e
    );

  }
}

function openImport(kind){

  const title=
    kind==='items'
    ?
    '批量导入商品'
    :

  modal(

    title,

    <div class="text-sm text-gray-600 mb-3">

      支持：

      CSV / TXT / TSV / XLSX / XLS

      <br>

      第一行必须是表头。

      <br>

      SKU如果有前导0，请在Excel中设置为“文本”。

    </div>


    <input
      id="importFile"
      type="file"
      accept="*/*"
      onchange="showSelectedFile()"
      class="w-full border rounded-xl p-3">


    <div
      id="selectedFile"
      class="text-sm text-gray-500 mt-2">

      尚未选择文件

    </div>


    <button
      onclick="runImport('${kind}')"
      class="w-full bg-blue-600 text-white rounded-xl py-3 mt-3 font-bold">

      开始导入

    </button>


    <div class="mt-4 text-xs text-gray-500">

      商品表头示例：

      名称, SKU, 低库存, 初始数量, 货位

      <br><br>

      库存表头示例：

      <br><br>

    </div>

function showSelectedFile(){

  const f=
    $('importFile')
      ?.files
      ?. [0];

  const e=$('selectedFile');


  if(!e)return;


  if(!f){

    e.textContent=
      '尚未选择文件';

    return;
  }


  e.textContent=
    `已选择：${f.name} · `+
    `${(f.size/1024).toFixed(1)} KB`;
}


function parseDelimited(
  text,
  delimiter=','
){

  const rows=[];

  let row=[];

  let cell='';

  let quote=false;


  for(
    let i=0;
    i<text.length;
    i++
  ){

    const c=text[i];

    const n=text[i+1];


    if(c==='"'){

      if(quote && n==='"'){

        cell+='"';

        i++;

      }else{

        quote=!quote;

      }

    }else if(
      c===delimiter &&
      !quote
    ){

      row.push(cell);

      cell='';

    }else if(
      (c==='\n'||c==='\r') &&
      !quote
    ){

      if(
        c==='\r' &&
        n==='\n'
      ){

        i++;

      }


      row.push(cell);

      cell='';


      if(
        row.some(
          v=>String(v).trim()!==''
        )
      ){

        rows.push(row);

      }


      row=[];

    }else{

      cell+=c;

    }

  }


  if(
    cell!=='' ||
    row.length
  ){

    row.push(cell);


    if(
      row.some(
        v=>String(v).trim()!==''
      )
    ){

      rows.push(row);

    }

  }


  return rows;
}


async function readRows(file){

  const name=
    (file.name||'')
      .toLowerCase();


  /* Excel */

  if(
    name.endsWith('.xlsx') ||
    name.endsWith('.xls')
  ){

    if(!window.XLSX){

      throw new Error(
        'Excel解析组件加载失败，请检查网络'
      );

    }


    const buf=
      await file.arrayBuffer();


    const wb=
      XLSX.read(
        buf,
        {
          type:'array',
          cellDates:false
        }
      );


    if(!wb.SheetNames.length){

      throw new Error(
        'Excel没有工作表'
      );

    }


    const ws=
      wb.Sheets[
        wb.SheetNames[0]
      ];


    return XLSX.utils.sheet_to_json(
      ws,
      {
        header:1,
        defval:'',
        raw:false
      }
    );
  }


  /* CSV / TXT / TSV */

  const text=
    await file.text();


  if(!text.trim()){

    throw new Error(
      '文件内容为空'
    );

  }


  const first=
    text.split(/\r?\n/)[0]||'';


  let delim=',';


  if(first.includes('\t'))
    delim='\t';

  else if(first.includes(';'))
    delim=';';


  return parseDelimited(
    text,
    delim
  );
}


function headerMap(row){

  const m={};


  row.forEach(
    (v,i)=>{

      const k=
        String(v??'')
          .replace(/^\uFEFF/,'')
          .trim()
          .toLowerCase();


      if(k)
        m[k]=i;

    }
  );


  return m;
}


function pick(
  row,
  h,
  names
){

  for(
    const n of names
  ){

    const i=
      h[n.toLowerCase()];


    if(i!==undefined){

      return String(
        row[i]??''
      ).trim();

    }

  }


  return '';
}


async function runImport(kind){

  const f=
    $('importFile')
      ?.files
      ?. [0];


  if(!f)
    return showError(
      '请选择文件'
    );


  try{

    const rows=
      await readRows(f);


    if(rows.length<2){

      throw new Error(
        '文件没有有效数据'
      );

    }


    const h=
      headerMap(rows[0]);


    /* 商品 */

    if(kind==='items'){

      let ok=0;

      let bad=[];


      for(
        let i=1;
        i<rows.length;
        i++
      ){

        const r=rows[i];


        const name=
          pick(
            r,
            h,
            [
              '名称',
              '商品名称',
              'name'
            ]
          );


        const sku=
          pick(
            r,
            h,
            [
              'sku',
              '条码',
              'barcode'
            ]
          );


        const alertS=
          pick(
            r,
            h,
            [
              '低库存',
              '预警',
              'alert',
              'alert_qty'
            ]
          );


        const qtyS=
          pick(
            r,
            h,
            [
              '初始数量',
              '库存',
              '数量',
              'qty'
            ]
          );


        const bin=
          pick(
            r,
            h,
            [
              '货位',
              '库位',
              'bin'
            ]
          );


        if(!name||!sku){

          bad.push(i+1);

          continue;
        }


        const alertQty=
          intVal(
            alertS===''
            ?
            0
            :
            alertS
          );


        const qty=
          intVal(
            qtyS===''
            ?
            0
            :
            qtyS
          );


        if(
          alertQty===null ||
          qty===null ||
          APP.inventory.some(
            x=>
              String(x.sku)
                .trim()
                .toLowerCase()
              ===
              sku.toLowerCase()
          )
        ){

          bad.push(i+1);

          continue;
        }


        const r1=
          await APP.sb.rpc(
            'create_inventory',
            {
              p_warehouse_id:
                APP.warehouse.id,

              p_name:name,

              p_sku:sku,

              p_qty:qty,

              p_alert:alertQty,

              p_bin:bin
            }
          );


        if(r1.error){

          bad.push(i+1);

          continue;
        }


        ok++;

      }


      await loadInventory();

      closeModal();

      renderApp();


      alert(
        `导入完成：成功 ${ok} 条，失败 ${bad.length} 条`+
        (
          bad.length
          ?
          '。失败行：'+bad.join(',')
          :
          ''
        )
      );


    }else{


      /* 批量入库 / 出库 */

      let ok=0;

      let bad=[];


      for(
        let i=1;
        i<rows.length;
        i++
      ){

        const r=rows[i];


        const sku=
          pick(
            r,
            h,
            [
              'sku',
              '条码',
              'barcode'
            ]
          );


        const qtyS=
          pick(
            r,
            h,
            [
              '数量',
              'qty',
              '数量变动'
            ]
          );


        const note=
          pick(
            r,
            h,
            [
              '备注',
              'note'
            ]
          );


        const qty=
          intVal(qtyS);


        const item=
          APP.inventory.find(
            x=>
              String(x.sku)
                .trim()
                .toLowerCase()
              ===
              sku.toLowerCase()
          );


        if(
          !item ||
          !qty ||
          qty<1 ||
          (
            APP.stockType==='out' &&
            Number(item.qty)<qty
          )
        ){

          bad.push(i+1);

          continue;
        }


        const r1=
          await APP.sb.rpc(
            'adjust_inventory',
            {
              p_inventory_id:item.id,
              p_type:APP.stockType,
              p_qty:qty,
              p_note:note
            }
          );


        if(r1.error){

          bad.push(i+1);

          continue;
        }


        ok++;

      }


      await Promise.all([
        loadInventory(),
        loadLogs()
      ]);


      closeModal();

      renderApp();


      alert(
        `批量${APP.stockType==='in'?'入库':'出库'}完成：成功 ${ok} 条，失败 ${bad.length} 条`+
        (
          bad.length
          ?
          '。失败行：'+bad.join(',')
          :
          ''
        )
      );

    }


  }catch(e){

    showRealError(
      '批量导入失败',
      e
    );

  }
}

   ========================================================= */

async function openScanner(mode){

  closeModal();


  APP.scannerMode=mode;


  modal(

    '扫码',

    `

    <div id="reader" class="w-full"></div>


    <div
      class="text-center text-sm text-gray-500 mt-3">

      请把条码/二维码放入框内。

      <br>

      扫码成功后会自动处理。

    </div>


    <button
      onclick="closeScanner()"
      class="w-full border rounded-xl py-3 mt-3">

      关闭相机

    </button>

    `
  );


  try{

    if(!window.Html5Qrcode){

      throw new Error(
        '扫码组件加载失败，请检查网络'
      );

    }


    APP.scanner=
      new Html5Qrcode(
        'reader'
      );


    const cams=
      await Html5Qrcode.getCameras();


    if(!cams?.length){

      throw new Error(
        '没有检测到摄像头，请允许浏览器使用相机'
      );

    }


    const back=
      cams.find(
        c=>
          /back|rear|environment|后置/i
            .test(c.label)
      )
      ||
      cams[cams.length-1];


    await APP.scanner.start(

      back.id,

      {
        fps:10,
        qrbox:{
          width:260,
          height:160
        }
      },

      decoded=>
        handleScan(decoded),

      ()=>{}

    );


    APP.scannerRunning=true;


  }catch(e){

    closeScanner();

    showRealError(
      '启动扫码失败',
      e
    );

  }
}


async function handleScan(decoded){

  if(!APP.scannerRunning)
    return;


  const code=
    String(decoded||'').trim();


  if(!code)
    return;


  const mode=
    APP.scannerMode;


  await closeScanner();


  /* 填 SKU */

  if(mode==='fill-sku'){

    openItem(
      null,
      code
    );

    return;
  }


  /* 查找 */

  if(mode==='find'){

    const item=
      APP.inventory.find(
        x=>
          String(x.sku)
            .trim()
            .toLowerCase()
          ===
          code.toLowerCase()
      );


    if(!item){

      alert(
        '未找到这个SKU：'+code
      );

      return;
    }


    APP.page='inventory';

    renderApp();


    setTimeout(()=>{

      const inp=
        $('invSearch');


      if(inp){

        inp.value=code;

        renderInventoryList();

      }

    },50);


    alert(
      `找到商品：${item.name}\n`+
      `SKU：${item.sku}\n`+
      `货位：${item.bin||'未设置'}\n`+
      `库存：${item.qty}`
    );


    return;
  }


  if(mode==='stock-in'){

    openStock(
      'in',
      code
    );

    return;
  }


  if(mode==='stock-out'){

    openStock(
      'out',
      code
    );

    return;
  }
}


async function closeScanner(){

  if(APP.scanner){

    try{

      if(APP.scannerRunning){

        await APP.scanner.stop();

      }

    }catch(e){}


    try{

      await APP.scanner.clear();

    }catch(e){}


    APP.scanner=null;

  }


  APP.scannerRunning=false;

  APP.scannerMode=null;

  closeModal();
}


/* =========================================================
   备份
   ========================================================= */

function exportBackup(){

  if(!APP.warehouse)
    return;


  const data={

    exported_at:
      new Date().toISOString(),

    warehouse:
      APP.warehouse,

    inventory:
      APP.inventory,

    stock_logs:
      APP.logs

  };


  const blob=
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:'application/json'
      }
    );


  const a=
    document.createElement('a');


  a.href=
    URL.createObjectURL(
      blob
    );


  a.download=
    'warehouse-backup-'+
    new Date()
      .toISOString()
      .slice(0,10)+
    '.json';


  a.click();


  setTimeout(
    ()=>{
      URL.revokeObjectURL(
        a.href
      );
    },
    1000
  );
}
