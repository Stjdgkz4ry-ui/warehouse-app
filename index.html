<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>云端仓库管理系统</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
body{
    background:#f5f7fb;
    -webkit-tap-highlight-color:transparent;
}
.safe-bottom{
    padding-bottom:calc(80px + env(safe-area-inset-bottom));
}
.hide{display:none!important}
.card{
    background:white;
    border-radius:16px;
    box-shadow:0 2px 12px rgba(0,0,0,.06);
}
.btn{
    min-height:44px;
    border-radius:12px;
    font-weight:600;
}
input,select,textarea{
    width:100%;
    border:1px solid #d9dee8;
    border-radius:12px;
    padding:12px;
    background:white;
    outline:none;
}
input:focus,select:focus,textarea:focus{
    border-color:#6366f1;
    box-shadow:0 0 0 3px rgba(99,102,241,.1);
}
.tab{
    padding:10px 16px;
    border-radius:10px;
    font-weight:600;
}
.tab.active{
    background:#111827;
    color:white;
}
.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:50;
    display:flex;
    align-items:flex-end;
    justify-content:center;
}
.modal{
    background:white;
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow:auto;
    border-radius:22px 22px 0 0;
    padding:20px;
}
.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    z-index:100;
    background:#111827;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    max-width:90%;
    text-align:center;
}
.low{
    color:#dc2626;
    font-weight:700;
}
.badge{
    display:inline-block;
    padding:4px 9px;
    border-radius:999px;
    font-size:12px;
    background:#eef2ff;
    color:#4338ca;
}
</style>
</head>

<body>

<!-- ==================== 登录/注册 ==================== -->
<div id="authPage" class="min-h-screen p-5 flex items-center justify-center">
    <div class="w-full max-w-md">

        <div class="text-center mb-6">
            <div class="text-4xl mb-2">📦</div>
            <h1 class="text-2xl font-bold">云端仓库管理系统</h1>
            <p class="text-gray-500 mt-2">多人协作 · 云端同步 · 手机扫码</p>
        </div>

        <!-- Supabase配置 -->
        <div id="configBox" class="card p-5 mb-4">
            <h2 class="font-bold text-lg mb-2">第一次使用</h2>
            <p class="text-sm text-gray-500 mb-4">
                填写 Supabase 项目地址和 Publishable / Anon Key。
                所有员工使用同一套项目地址和 Key。
            </p>

            <label class="text-sm font-semibold">Supabase Project URL</label>
            <input id="projectUrl"
                   class="mt-2 mb-4"
                   placeholder="https://xxxx.supabase.co">

            <label class="text-sm font-semibold">Supabase Anon / Publishable Key</label>
            <input id="projectKey"
                   class="mt-2 mb-4"
                   placeholder="粘贴你的 Publishable / Anon Key"
                   type="password">

            <button onclick="saveConfig()"
                    class="btn w-full bg-indigo-600 text-white">
                连接云端
            </button>
        </div>

        <!-- 登录 -->
        <div id="loginBox" class="card p-5 hide">

            <div class="flex bg-gray-100 rounded-xl p-1 mb-5">
                <button id="loginTab"
                        class="tab active flex-1"
                        onclick="showLogin()">
                    登录
                </button>

                <button id="registerTab"
                        class="tab flex-1"
                        onclick="showRegister()">
                    注册
                </button>
            </div>

            <div id="authForm">

                <label class="text-sm font-semibold">邮箱</label>
                <input id="email"
                       class="mt-2 mb-4"
                       type="email"
                       autocomplete="email"
                       placeholder="请输入邮箱">

                <label class="text-sm font-semibold">密码</label>
                <input id="password"
                       class="mt-2 mb-4"
                       type="password"
                       autocomplete="current-password"
                       placeholder="至少 6 位">

                <button id="authButton"
                        onclick="submitAuth()"
                        class="btn w-full bg-indigo-600 text-white">
                    登录
                </button>

            </div>

            <button onclick="resetConfig()"
                    class="w-full text-sm text-gray-500 mt-4">
                修改云端配置
            </button>

        </div>

    </div>
</div>


<!-- ==================== 主程序 ==================== -->
<div id="appPage" class="hide min-h-screen">

    <!-- 顶部 -->
    <header class="bg-white sticky top-0 z-20 border-b">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">

            <div>
                <div class="font-bold">📦 云端仓库</div>
                <div id="warehouseTitle" class="text-xs text-gray-500">
                    未选择仓库
                </div>
            </div>

            <button onclick="logout()"
                    class="text-sm text-red-500">
                退出
            </button>

        </div>
    </header>


    <main class="max-w-6xl mx-auto p-4 safe-bottom">

        <!-- 仓库选择 -->
        <section id="warehouseSection" class="card p-4 mb-4">

            <div class="flex items-center justify-between mb-3">
                <h2 class="font-bold text-lg">我的仓库</h2>
                <button onclick="openWarehouseModal()"
                        class="text-indigo-600 font-semibold">
                    管理
                </button>
            </div>

            <select id="warehouseSelect"
                    onchange="selectWarehouse(this.value)">
                <option value="">请选择仓库</option>
            </select>

            <div class="grid grid-cols-2 gap-3 mt-3">

                <button onclick="openCreateWarehouse()"
                        class="btn bg-indigo-600 text-white">
                    ➕ 创建仓库
                </button>

                <button onclick="openJoinWarehouse()"
                        class="btn bg-gray-100">
                    🔗 加入仓库
                </button>

            </div>

            <div id="joinCodeBox"
                 class="mt-3 p-3 rounded-xl bg-indigo-50 text-sm hide">
                <div class="text-gray-500">当前仓库加入码</div>
                <div id="currentJoinCode"
                     class="text-2xl font-bold tracking-widest mt-1">
                </div>
            </div>

        </section>


        <!-- 主导航 -->
        <div id="mainContent" class="hide">

            <div class="grid grid-cols-4 gap-2 mb-4">

                <button id="navInventory"
                        onclick="showPage('inventory')"
                        class="btn bg-indigo-600 text-white text-sm">
                    库存
                </button>

                <button id="navStock"
                        onclick="showPage('stock')"
                        class="btn bg-gray-100 text-sm">
                    出入库
                </button>

                <button id="navLogs"
                        onclick="showPage('logs')"
                        class="btn bg-gray-100 text-sm">
                    日志
                </button>

                <button id="navSettings"
                        onclick="showPage('settings')"
                        class="btn bg-gray-100 text-sm">
                    设置
                </button>

            </div>


            <!-- ================= 库存 ================= -->
            <section id="pageInventory">

                <div class="card p-4 mb-4">

                    <div class="flex gap-2">

                        <input id="searchInput"
                               placeholder="搜索名称 / SKU / 库位"
                               oninput="renderInventory()">

                        <button onclick="startScanner()"
                                class="btn bg-indigo-600 text-white px-4">
                            📷
                        </button>

                    </div>

                    <div class="grid grid-cols-2 gap-3 mt-3">

                        <button onclick="openAddItem()"
                                class="btn bg-green-600 text-white">
                            ➕ 新增商品
                        </button>

                        <button onclick="openImportModal()"
                                class="btn bg-gray-100">
                            📥 批量导入
                        </button>

                    </div>

                </div>

                <div id="inventoryStats"
                     class="grid grid-cols-3 gap-3 mb-4">
                </div>

                <div id="inventoryList"
                     class="space-y-3">
                </div>

            </section>


            <!-- ================= 出入库 ================= -->
            <section id="pageStock" class="hide">

                <div class="card p-4">

                    <h2 class="font-bold text-lg mb-4">
                        快速出入库
                    </h2>

                    <label class="text-sm font-semibold">
                        SKU
                    </label>

                    <input id="stockSku"
                           class="mt-2 mb-4"
                           placeholder="输入或扫描 SKU">

                    <div class="grid grid-cols-2 gap-3">

                        <button onclick="openStockBySku('in')"
                                class="btn bg-green-600 text-white">
                            📥 入库
                        </button>

                        <button onclick="openStockBySku('out')"
                                class="btn bg-red-600 text-white">
                            📤 出库
                        </button>

                    </div>

                </div>

            </section>


            <!-- ================= 日志 ================= -->
            <section id="pageLogs" class="hide">

                <div class="card p-4">

                    <div class="flex items-center justify-between mb-4">
                        <h2 class="font-bold text-lg">操作日志</h2>

                        <button onclick="loadLogs()"
                                class="text-indigo-600">
                            刷新
                        </button>
                    </div>

                    <div id="logsList"
                         class="space-y-3">
                    </div>

                </div>

            </section>


            <!-- ================= 设置 ================= -->
            <section id="pageSettings" class="hide">

                <div class="card p-4 mb-4">

                    <h2 class="font-bold text-lg mb-4">
                        仓库设置
                    </h2>

                    <div class="p-4 bg-gray-50 rounded-xl">

                        <div class="text-sm text-gray-500">
                            仓库名称
                        </div>

                        <div id="settingsWarehouseName"
                             class="font-bold mt-1">
                        </div>

                        <div class="text-sm text-gray-500 mt-4">
                            我的权限
                        </div>

                        <div id="myRole"
                             class="font-bold mt-1">
                        </div>

                        <div class="text-sm text-gray-500 mt-4">
                            加入码
                        </div>

                        <div id="settingsJoinCode"
                             class="font-bold tracking-widest mt-1">
                        </div>

                    </div>

                </div>

                <div class="card p-4">

                    <h2 class="font-bold text-lg mb-3">
                        数据
                    </h2>

                    <div class="grid grid-cols-2 gap-3">

                        <button onclick="exportBackup()"
                                class="btn bg-gray-100">
                            💾 导出备份
                        </button>

                        <button onclick="resetConfig()"
                                class="btn bg-gray-100">
                            ⚙️ 云端配置
                        </button>

                    </div>

                </div>

            </section>

        </div>

    </main>
</div>


<!-- ==================== 商品编辑 ==================== -->
<div id="itemModal" class="modal-bg hide">

    <div class="modal">

        <div class="flex justify-between items-center mb-5">

            <h2 id="itemModalTitle"
                class="text-xl font-bold">
                新增商品
            </h2>

            <button onclick="closeModal('itemModal')"

                ×
            </button>

        </div>

        <label class="text-sm font-semibold">
            商品名称
        </label>

        <input id="itemName"
               class="mt-2 mb-4"
               placeholder="例如：可乐">

        <label class="text-sm font-semibold">
            SKU
        </label>

        <input id="itemSku"
               class="mt-2 mb-4"
               placeholder="例如：COKE001">

        <label class="text-sm font-semibold">
            数量
        </label>

        <input id="itemQty"

               type="number"
               min="0"
               value="0">

        <label class="text-sm font-semibold">
            库存预警
        </label>

        <input id="itemAlert"
               class="mt-2 mb-4"
               type="number"
               min="0"
               value="5">

        <label class="text-sm font-semibold">
            库位
        </label>

        <input id="itemBin"
               class="mt-2 mb-5"
               placeholder="例如：A-01-02">

        <button onclick="saveItem()"
                class="btn w-full bg-indigo-600 text-white">
            保存
        </button>

    </div>
</div>


<!-- ==================== 出入库 ==================== -->
<div id="stockModal" class="modal-bg hide">

    <div class="modal">

        <div class="flex justify-between items-center mb-5">

            <h2 id="stockModalTitle"
                class="text-xl font-bold">
                入库
            </h2>

            <button onclick="closeModal('stockModal')"
                    class="text-2xl">
                ×
            </button>

        </div>

        <div id="stockItemInfo"
             class="p-3 bg-gray-50 rounded-xl mb-4">
        </div>

        <label class="text-sm font-semibold">
            数量

        <input id="stockQty"
               class="mt-2 mb-4"
               type="number"
               min="1"
               value="1">

        <label class="text-sm font-semibold">
            备注
        </label>

        <textarea id="stockNote"

                  rows="3"
                  placeholder="例如：供应商送货"></textarea>

        <button onclick="saveStock()"
                class="btn w-full bg-indigo-600 text-white">
            确认
        </button>

    </div>
</div>


<!-- ==================== 批量导入 ==================== -->
<div id="importModal" class="modal-bg hide">

    <div class="modal">

        <div class="flex justify-between items-center mb-5">

            <h2 class="text-xl font-bold">
                批量导入
            </h2>

            <button onclick="closeModal('importModal')"

                ×
            </button>

        </div>

        <p class="text-sm text-gray-500 mb-3">

矿泉水,WATER001,50,5,A-02"></textarea>

        <button onclick="runImport()"

<!-- ==================== 创建仓库 ==================== -->
<div id="createWarehouseModal" class="modal-bg hide">

    <div class="modal">

        <div class="flex justify-between items-center mb-5">

            <h2 class="text-xl font-bold">
                创建仓库
            </h2>

            <button onclick="closeModal('createWarehouseModal')"

                ×
            </button>

        </div>

        <label class="text-sm font-semibold">

        </label>

        <input id="newWarehouseName"

        <button onclick="createWarehouse()"

        </button>

    </div>
</div>


<!-- ==================== 加入仓库 ==================== -->
<div id="joinWarehouseModal" class="modal-bg hide">

    <div class="modal">

        <div class="flex justify-between items-center mb-5">

            <h2 class="text-xl font-bold">
                加入仓库
            </h2>

            <button onclick="closeModal('joinWarehouseModal')"

                ×
            </button>

        </p>

        <input id="joinCode"

<!-- ==================== 仓库管理 ==================== -->
<div id="warehouseModal" class="modal-bg hide">

    <div class="modal">

        <div class="flex justify-between items-center mb-5">

            <h2 class="text-xl font-bold">
                仓库管理
            </h2>

            <button onclick="closeModal('warehouseModal')"
                    class="text-2xl">
                ×
            </button>

        </div>

        <div id="warehouseManageList"
             class="space-y-3">
        </div>

</div>


<!-- ==================== 扫码 ==================== -->
<div id="scannerModal" class="modal-bg hide">

    <div class="modal">

        <div class="flex justify-between items-center mb-4">

            <h2 class="text-xl font-bold">
                扫描条码
            </h2>

            <button onclick="stopScanner()"
                    class="text-2xl">
                ×
            </button>

        </div>

        <div id="reader"
             style="width:100%;">
        </div>

        <p class="text-sm text-gray-500 mt-3 text-center">
            将条形码或二维码放入框内
        </p>

    </div>
</div>


<div id="toast"
     class="toast hide">
</div>


<script>
/* ============================================================
   全局变量
============================================================ */

let sb = null;

let currentUser = null;
let currentWarehouse = null;
let currentRole = null;

let warehouses = [];
let inventory = [];
let logs = [];

let editingItem = null;
let stockType = 'in';
let stockItem = null;

let scanner = null;


/* ============================================================
   工具
============================================================ */

function $(id){
    return document.getElementById(id);
}

function toast(message){
    const el = $('toast');

    el.textContent = message;
    el.classList.remove('hide');

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(()=>{
        el.classList.add('hide');
    },3000);
}

function closeModal(id){
    $(id).classList.add('hide');
}

function openModal(id){
    $(id).classList.remove('hide');
}

function escapeHtml(value){
    return String(value ?? '')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
}

function getConfig(){
    try{
        return JSON.parse(localStorage.getItem('warehouse_supabase_config') || 'null');
    }catch(e){
        return null;
    }
}


/* ============================================================
   页面初始化
============================================================ */

document.addEventListener('DOMContentLoaded',()=>{

    const config = getConfig();

    if(config && config.url && config.key){

        $('projectUrl').value = config.url;
        $('projectKey').value = config.key;

        initSupabase(config);

    }else{

        $('configBox').classList.remove('hide');
        $('loginBox').classList.add('hide');

    }

});


/* ============================================================
   Supabase 初始化
============================================================ */

function initSupabase(config){

    try{

        if(!window.supabase){
            throw new Error(
                'Supabase 程序没有加载成功，请检查手机网络后刷新页面'
            );
        }

        if(!config.url){
            throw new Error('缺少 Supabase Project URL');
        }

        if(!config.key){
            throw new Error('缺少 Supabase Publishable / Anon Key');
        }

        sb = window.supabase.createClient(
            config.url.trim(),
            config.key.trim()
        );

        if(!sb || !sb.auth){
            throw new Error('Supabase 初始化失败');
        }

        $('configBox').classList.add('hide');
        $('loginBox').classList.remove('hide');

        sb.auth.onAuthStateChange((event,session)=>{

            setTimeout(()=>{
                handleSession(session);
            },0);

        });

        sb.auth.getSession().then(({data,error})=>{

            if(error){
                console.error(error);
                return;
            }

            handleSession(data.session);

        }).catch(error=>{

            console.error(error);

        });

    }catch(error){

        console.error(error);

        toast('连接失败：' + (error.message || error));

        $('configBox').classList.remove('hide');
        $('loginBox').classList.add('hide');

    }

}


/* ============================================================
   保存 Supabase 配置
============================================================ */

function saveConfig(){

    const url = $('projectUrl').value.trim();
    const key = $('projectKey').value.trim();

    if(!url){
        toast('请输入 Supabase Project URL');
        return;
    }

    if(!key){
        toast('请输入 Publishable / Anon Key');
        return;
    }

    if(!url.startsWith('https://')){
        toast('Project URL 应该以 https:// 开头');
        return;
    }

    localStorage.setItem(
        'warehouse_supabase_config',
        JSON.stringify({
            url:url,
            key:key
        })
    );

    initSupabase({
        url:url,
        key:key
    });

}


/* ============================================================
   修改配置
============================================================ */

async function resetConfig(){

    const ok = confirm(
        '确定要修改云端配置吗？\n\n修改后需要重新连接 Supabase。'
    );

    if(!ok) return;

    try{

        if(sb){
            await sb.auth.signOut();
        }

    }catch(e){}

    localStorage.removeItem('warehouse_supabase_config');

    location.reload();

}


/* ============================================================
   登录 / 注册
============================================================ */

let authMode = 'login';

function showLogin(){

    authMode = 'login';

    $('loginTab').classList.add('active');
    $('registerTab').classList.remove('active');

    $('authButton').textContent = '登录';

    $('password').autocomplete = 'current-password';

}

function showRegister(){

    authMode = 'register';

    $('registerTab').classList.add('active');
    $('loginTab').classList.remove('active');

    $('authButton').textContent = '注册';

    $('password').autocomplete = 'new-password';

}

async function submitAuth(){

    if(!sb){
        toast('还没有连接 Supabase');
        return;
    }

    const email = $('email').value.trim();
    const password = $('password').value;

    if(!email){
        toast('请输入邮箱');
        return;
    }

    if(!password){
        toast('请输入密码');
        return;
    }

    if(password.length < 6){
        toast('密码至少需要 6 位');
        return;
    }

    const button = $('authButton');

    button.disabled = true;
    button.textContent = '处理中...';

    try{

        if(authMode === 'login'){

            const {data,error} =
                await sb.auth.signInWithPassword({
                    email:email,
                    password:password
                });

            if(error){
                throw error;
            }

            toast('登录成功');

        }else{

            const {data,error} =
                await sb.auth.signUp({
                    email:email,
                    password:password
                });

            if(error){
                throw error;
            }

            if(data && data.session){

                toast('注册成功');

            }else{

                toast('注册成功，请检查邮箱完成验证');

            }

        }

    }catch(error){

        console.error('AUTH ERROR:',error);

        let message = error?.message || String(error);

        if(message.includes('Invalid login credentials')){
            message = '邮箱或密码错误';
        }

        if(message.includes('User already registered')){
            message = '这个邮箱已经注册，请直接登录';
        }

        if(message.includes('Password should be at least')){
            message = '密码至少需要 6 位';
        }

        if(message.includes('Email not confirmed')){
            message = '邮箱还没有验证，请先去邮箱完成验证';
        }

        toast('操作失败：' + message);

    }finally{

        button.disabled = false;
        button.textContent =
            authMode === 'login' ? '登录' : '注册';

    }

}

async function loadWarehouses(){

    if(!currentUser) return;

    try{

        const {data:members,error:memberError} =
            await sb
                .from('warehouse_members')
                .select('warehouse_id,role')
                .eq('user_id',currentUser.id);

        if(memberError){
            throw memberError;
        }

        if(!members || members.length === 0){

            warehouses = [];

            renderWarehouses();

            $('mainContent').classList.add('hide');

            toast('你还没有仓库，请创建或加入一个仓库');

            return;

        }

        const ids = members.map(x=>x.warehouse_id);

        const {data:warehouseData,error:warehouseError} =
            await sb
                .from('warehouses')
                .select('*')
                .in('id',ids)
                .order('created_at',{ascending:false});

        if(warehouseError){
            throw warehouseError;
        }

        warehouses = (warehouseData || []).map(w=>{

            const member = members.find(
                x=>x.warehouse_id === w.id
            );

            return {
                ...w,
                role:member ? member.role : 'member'
            };

        });

        renderWarehouses();

        if(currentWarehouse){

            const exists = warehouses.find(
                w=>w.id === currentWarehouse.id
            );

            if(exists){

                currentWarehouse = exists;
                currentRole = exists.role;

                await loadWarehouseData();

                return;

            }

        }

        if(warehouses.length > 0){

            selectWarehouse(warehouses[0].id);

        }

    }catch(error){

        console.error(error);

        toast('读取仓库失败：' + (error.message || error));

    }

}


function renderWarehouses(){

    const select = $('warehouseSelect');

    select.innerHTML =
        '<option value="">请选择仓库</option>';

    warehouses.forEach(w=>{

        const option = document.createElement('option');

        option.value = w.id;

        option.textContent =
            w.name + '（' + roleText(w.role) + '）';

        if(currentWarehouse &&
           currentWarehouse.id === w.id){

            option.selected = true;

        }

        select.appendChild(option);

    });

}


function roleText(role){

    if(role === 'owner') return '所有者';
    if(role === 'admin') return '管理员';

    return '员工';

}

    const totalQty =
        inventory.reduce(

async function saveItem(){

    if(!currentWarehouse){

        toast('请先选择仓库');
        return;

    }

    const name =
        $('itemName').value.trim();

    const sku =
        $('itemSku').value.trim();

    const qty =
        parseInt($('itemQty').value || '0',10);

    const alert =
        parseInt($('itemAlert').value || '0',10);

    const bin =
        $('itemBin').value.trim();

    if(!name){
        toast('请输入商品名称');
        return;
    }

    if(!sku){
        toast('请输入 SKU');
        return;
    }

    if(qty < 0){
        toast('数量不能小于 0');
        return;
    }

    if(alert < 0){
        toast('预警数量不能小于 0');
        return;
    }

    try{

        if(editingItem){

            const {error} =
                await sb.rpc(
                    'update_inventory_info',
                    {
                        p_inventory_id:editingItem.id,
                        p_name:name,
                        p_sku:sku,
                        p_alert:alert,
                        p_bin:bin
                    }
                );

            if(error){
                throw error;
            }

            /*
             * 注意：
             * 库存数量不通过普通编辑修改。
             * 数量必须通过入库/出库修改。
             */

            if(Number(editingItem.qty) !== qty){

                toast(
                    '商品资料已保存。库存数量请使用入库/出库修改。'
                );

            }else{

                toast('商品修改成功');

            }

        }else{

            const {error} =
                await sb.rpc(
                    'create_inventory',
                    {
                        p_warehouse_id:currentWarehouse.id,
                        p_name:name,
                        p_sku:sku,
                        p_qty:qty,
                        p_alert:alert,
                        p_bin:bin
                    }
                );

            if(error){
                throw error;
            }

            toast('商品新增成功');

        }

        closeModal('itemModal');

        await loadInventory();

    }catch(error){

        console.error(error);

        toast('保存失败：' + (error.message || error));

    }

}

============================================================ */

function openImportModal(){

    $('importText').value = '';

    openModal('importModal');

}


async function runImport(){

    if(!currentWarehouse){

        toast('请先选择仓库');
        return;

    }

    const text =
        $('importText').value.trim();

    if(!text){

        toast('请粘贴要导入的内容');
        return;

    }

    const lines =
        text.split(/\r?\n/)
            .map(x=>x.trim())
            .filter(Boolean);

    let success = 0;
    let failed = 0;

    for(const line of lines){

        let parts;

        if(line.includes(',')){
            parts = line.split(',');
        }else if(line.includes('，')){
            parts = line.split('，');
        }else if(line.includes('\t')){
            parts = line.split('\t');
        }else{
            failed++;
            continue;
        }

        const name =
            String(parts[0] || '').trim();

        const sku =
            String(parts[1] || '').trim();

        const qty =
            parseInt(String(parts[2] || '0').trim(),10);

        const alert =
            parseInt(String(parts[3] || '5').trim(),10);

        const bin =
            String(parts[4] || '').trim();

        if(!name || !sku || Number.isNaN(qty)){

            failed++;
            continue;

        }

        try{

            const {error} =
                await sb.rpc(
                    'create_inventory',
                    {
                        p_warehouse_id:currentWarehouse.id,
                        p_name:name,
                        p_sku:sku,
                        p_qty:qty,
                        p_alert:Number.isNaN(alert) ? 5 : alert,
                        p_bin:bin
                    }
                );

            if(error){

                /*
                 * 如果 SKU 已存在，尝试当成更新资料。
                 */
                const existing =
                    inventory.find(
                        x=>String(x.sku).toLowerCase() ===
                           sku.toLowerCase()
                    );

                if(existing){

                    const {error:updateError} =
                        await sb.rpc(
                            'update_inventory_info',
                            {
                                p_inventory_id:existing.id,
                                p_name:name,
                                p_sku:sku,
                                p_alert:Number.isNaN(alert) ? 5 : alert,
                                p_bin:bin
                            }
                        );

                    if(updateError){
                        failed++;
                    }else{
                        success++;
                    }

                }else{

                    failed++;

                }

            }else{

                success++;

            }

        }catch(e){

            failed++;

        }

    }

    closeModal('importModal');

    await loadInventory();

    toast(
        '导入完成：成功 ' +
        success +
        ' 条，失败 ' +
        failed +
        ' 条'
    );

}

async function startScanner(){

    if(typeof Html5Qrcode === 'undefined'){

        toast('扫码程序没有加载成功');
        return;

    }

    openModal('scannerModal');

    try{

        scanner =
            new Html5Qrcode('reader');

        await scanner.start(
            {
                facingMode:'environment'
            },
            {
                fps:10,
                qrbox:{
                    width:250,
                    height:150
                }
            },
            (decodedText)=>{

                stopScanner();

                const sku =
                    String(decodedText).trim();

                $('searchInput').value = sku;

                renderInventory();

                const item =
                    inventory.find(
                        x=>String(x.sku).toLowerCase() ===
                           sku.toLowerCase()
                    );

                if(item){

                    openStockModal(item.id,'in');

                }else{

                    toast(
                        '扫描结果：' + sku
                    );

                }

            },
            ()=>{}

        );

    }catch(error){

        console.error(error);

        toast(
            '无法打开摄像头：' +
            (error.message || error)
        );

        closeModal('scannerModal');

    }

}


async function stopScanner(){

    try{

        if(scanner){

            await scanner.stop();

            scanner.clear();

        }

    }catch(e){

        console.error(e);

    }

    scanner = null;

    closeModal('scannerModal');

}

    }

    if(page === 'logs'){

        $('pageLogs').classList.remove('hide');

        $('navLogs').className =
            'btn bg-indigo-600 text-white text-sm';

        loadLogs();

    }

    if(page === 'settings'){

        $('pageSettings').classList.remove('hide');

        $('navSettings').className =
            'btn bg-indigo-600 text-white text-sm';

    }

}


/* ============================================================
   备份
============================================================ */

function exportBackup(){

    if(!currentWarehouse){

        toast('请先选择仓库');
        return;

    }

    const backup = {

        exported_at:new Date().toISOString(),

        warehouse:{
            id:currentWarehouse.id,
            name:currentWarehouse.name
        },

        inventory:inventory,

        logs:logs

    };

    const blob =
        new Blob(
            [JSON.stringify(backup,null,2)],
            {
                type:'application/json'
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement('a');

    a.href = url;

    a.download =
        'warehouse-backup-' +
        new Date().toISOString().slice(0,10) +
        '.json';

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

    toast('备份文件已生成');

}


/* ============================================================
   页面关闭弹窗
============================================================ */

document.querySelectorAll('.modal-bg').forEach(bg=>{

    bg.addEventListener('click',(event)=>{

        if(event.target === bg){

            bg.classList.add('hide');

        }

    });

});


/* ============================================================
   防止 Enter 意外提交
============================================================ */

document.addEventListener('keydown',(event)=>{

    if(event.key === 'Enter'){

        const target = event.target;

        if(
            target &&
            target.tagName === 'INPUT' &&
            target.id === 'joinCode'
        ){

            event.preventDefault();

            joinWarehouse();

        }

    }

});
